text:
  comment: The text content of the heading.
  type: textarea
level:
  comment: The heading level or type.
  type: select
  options:
    values:
      - h1
      - h2
      - h3
      - h4
      - h5
      - h6
size:
  comment: The font size of the text.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
alignmentHorizontal:
  comment: Horizontal alignment of the text.
  type: select
  options:
    values:
      - id: start
        name: Start
      - id: center
        name: Center
      - id: end
        name: End
iconName:
  comment: Icon to display, from [Heroicons](https://heroicons.com/).
  type: select
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
iconColor:
  type: select
  comment: The color of the icon.
  hidden: "!iconName"
  options:
    values:
      - id: default
        name: Default
        preview:
          icon: check_box_outline_blank
      - id: pacific
        name: Pacific
        preview:
          icon: square
          icon_color: "#034AD8"
      - id: moss
        name: Moss
        preview:
          icon: square
          icon_color: "#687E00"
      - id: golden
        name: Golden
        preview:
          icon: square
          icon_color: "#FFAA00"
      - id: peachy
        name: Peachy
        preview:
          icon: square
          icon_color: "#F39B7B"
      - id: sunset
        name: Sunset
        preview:
          icon: square
          icon_color: "#D85A2C"
      - id: kiwi
        name: Kiwi
        preview:
          icon: square
          icon_color: "#7C3442"
      - id: blush
        name: Blush
        preview:
          icon: square
          icon_color: "#E7B0B9"
      - id: harbour
        name: Harbour
        preview:
          icon: square
          icon_color: "#A6C1FA"
iconPosition:
  comment: The position of the icon relative to the text.
  type: select
  options:
    values:
      - id: before
        name: Before
      - id: after
        name: After
