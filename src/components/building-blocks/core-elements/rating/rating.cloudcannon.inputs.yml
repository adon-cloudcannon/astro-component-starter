value:
  type: number
  comment: Rating shown, from 0 to the maximum. Halves work, e.g. 4.5.
  options:
    step: 0.5
    min: 0
    max: 10
max:
  type: number
  comment: How many stars the scale has.
  options:
    step: 1
    min: 1
    max: 10
size:
  type: select
  comment: The size of the stars.
  options:
    values:
      - id: sm
        name: Small
      - id: md
        name: Medium
color:
  type: select
  comment: The color of the filled stars. Default inherits the text color; empty stars stay muted.
  options:
    values:
      - id: default
        name: Default (inherit)
        preview:
          icon: check_box_outline_blank
      - id: pacific
        name: Pacific
        preview:
          icon: square
          icon_color: "#034AD8"
      - id: moss
        name: Moss
        preview:
          icon: square
          icon_color: "#687E00"
      - id: golden
        name: Golden
        preview:
          icon: square
          icon_color: "#FFAA00"
      - id: peachy
        name: Peachy
        preview:
          icon: square
          icon_color: "#F39B7B"
      - id: sunset
        name: Sunset
        preview:
          icon: square
          icon_color: "#D85A2C"
      - id: kiwi
        name: Kiwi
        preview:
          icon: square
          icon_color: "#7C3442"
      - id: blush
        name: Blush
        preview:
          icon: square
          icon_color: "#E7B0B9"
      - id: harbour
        name: Harbour
        preview:
          icon: square
          icon_color: "#A6C1FA"
showValue:
  type: switch
  comment: Show the numeric value beside the stars.
alignmentHorizontal:
  type: select
  comment: Horizontal alignment of the rating.
  options:
    values:
      - id: none
        name: None (in flow)
      - id: start
        name: Start
      - id: center
        name: Center
      - id: end
        name: End
