name:
  type: select
  comment: Icon to display, from [Heroicons](https://heroicons.com/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
size:
  type: select
  comment: The size of the icon.
  options:
    values:
      - id: none
        name: None (inherit the surrounding text size)
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl Large
      - id: 3xl
        name: 3xl Large
color:
  type: select
  comment: The color of the icon.
  options:
    values:
      - id: default
        name: Default (inherit)
        swatch: check_box_outline_blank
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
      - id: moss
        name: Moss
        swatch: square
        color: "#687E00"
      - id: golden
        name: Golden
        swatch: square
        color: "#FFAA00"
      - id: peachy
        name: Peachy
        swatch: square
        color: "#F39B7B"
      - id: sunset
        name: Sunset
        swatch: square
        color: "#D85A2C"
      - id: kiwi
        name: Kiwi
        swatch: square
        color: "#7C3442"
      - id: blush
        name: Blush
        swatch: square
        color: "#E7B0B9"
      - id: harbour
        name: Harbour
        swatch: square
        color: "#A6C1FA"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
background:
  type: switch
  comment: Show a background behind the icon.
alignmentHorizontal:
  type: select
  comment: Horizontal alignment of the icon.
  options:
    values:
      - id: none
        name: None (in flow)
      - id: start
        name: Start
      - id: center
        name: Center
      - id: end
        name: End
