name:
  type: select
  comment: Icon to display, from [Heroicons](https://heroicons.com/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
size:
  type: select
  comment: The size of the icon.
  options:
    values:
      - id: none
        name: None (inherit the surrounding text size)
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl Large
      - id: 3xl
        name: 3xl Large
color:
  type: select
  comment: The color of the icon.
  options:
    values:
      - id: default
        name: Default (inherit)
      - id: pacific
        name: Pacific
      - id: moss
        name: Moss
      - id: golden
        name: Golden
      - id: peachy
        name: Peachy
      - id: sunset
        name: Sunset
      - id: kiwi
        name: Kiwi
      - id: blush
        name: Blush
      - id: harbour
        name: Harbour
background:
  type: switch
  comment: Show a background behind the icon.
alignmentHorizontal:
  type: select
  comment: Horizontal alignment of the icon.
  options:
    values:
      - id: none
        name: None (in flow)
      - id: start
        name: Start
      - id: center
        name: Center
      - id: end
        name: End
