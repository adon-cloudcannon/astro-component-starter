text:
  type: text
  comment: Button text. Still required with Hide Text on, as the accessible name.
link:
  type: url
  comment: The URL to which the button should link.
iconName:
  type: select
  comment: Icon to display, from [Heroicons](https://heroicons.com/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
iconColor:
  type: select
  comment: The color of the icon.
  hidden: "!iconName"
  options:
    values:
      - id: default
        name: Default
        preview:
          icon: check_box_outline_blank
      - id: pacific
        name: Pacific
        preview:
          icon: square
          icon_color: "#034AD8"
      - id: moss
        name: Moss
        preview:
          icon: square
          icon_color: "#687E00"
      - id: golden
        name: Golden
        preview:
          icon: square
          icon_color: "#FFAA00"
      - id: peachy
        name: Peachy
        preview:
          icon: square
          icon_color: "#F39B7B"
      - id: sunset
        name: Sunset
        preview:
          icon: square
          icon_color: "#D85A2C"
      - id: kiwi
        name: Kiwi
        preview:
          icon: square
          icon_color: "#7C3442"
      - id: blush
        name: Blush
        preview:
          icon: square
          icon_color: "#E7B0B9"
      - id: harbour
        name: Harbour
        preview:
          icon: square
          icon_color: "#A6C1FA"
textColor:
  type: select
  label: Label color
  comment: >-
    Colours the label and the icon together. The design draws an arrow link as
    one colour rather than a coloured arrow beside a base-coloured word.
  options:
    values:
      - id: default
        name: Default
        preview:
          icon: check_box_outline_blank
      - id: pacific
        name: Pacific
        preview:
          icon: square
          icon_color: "#034AD8"
      - id: moss
        name: Moss
        preview:
          icon: square
          icon_color: "#687E00"
      - id: golden
        name: Golden
        preview:
          icon: square
          icon_color: "#FFAA00"
      - id: peachy
        name: Peachy
        preview:
          icon: square
          icon_color: "#F39B7B"
      - id: sunset
        name: Sunset
        preview:
          icon: square
          icon_color: "#D85A2C"
      - id: kiwi
        name: Kiwi
        preview:
          icon: square
          icon_color: "#7C3442"
      - id: blush
        name: Blush
        preview:
          icon: square
          icon_color: "#E7B0B9"
      - id: harbour
        name: Harbour
        preview:
          icon: square
          icon_color: "#A6C1FA"
iconPosition:
  type: select
  comment: The position of the icon relative to the text.
  hidden: "!iconName"
  options:
    values:
      - id: before
        name: Before
      - id: after
        name: After
hideText:
  type: switch
  hidden: "!iconName"
  comment: Shows only the icon and hides the text.
variant:
  type: select
  comment: The presentation of the button.
  options:
    values:
      - id: primary
        name: Primary
      - id: secondary
        name: Secondary
      - id: tertiary
        name: Tertiary
      - id: ghost
        name: Ghost
      - id: text
        name: Text
size:
  type: select
  comment: The size of the button.
  options:
    values:
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
