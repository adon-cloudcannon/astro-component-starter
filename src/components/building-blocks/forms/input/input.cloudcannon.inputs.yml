label:
  type: text
  comment: The label text for the input field.
name:
  type: text
  comment: Name the field is submitted under. Must be unique in the form.
type:
  type: select
  options:
    values:
      - text
      - email
      - password
      - tel
      - url
      - number
  comment: The input type.
placeholder:
  type: text
  comment: Placeholder text for the input field.
required:
  type: switch
  comment: Whether the field is required.
value:
  type: text
  comment: The default value for the input field.
hint:
  type: text
  comment: Help text shown between the label and the field.
autocomplete:
  type: select
  options:
    values: data.autocomplete_tokens
    value_key: id
    allow_create: true
    preview:
      text:
        - key: name
      subtext:
        - key: id
  comment: Autofill hint for browsers. Leave blank to derive it from the field's type and name.
iconName:
  type: select
  comment: Icon to display, from [Heroicons](https://heroicons.com/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
iconColor:
  type: select
  comment: The color of the icon.
  hidden: "!iconName"
  options:
    values:
      - id: default
        name: Default
        swatch: check_box_outline_blank
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
      - id: moss
        name: Moss
        swatch: square
        color: "#687E00"
      - id: golden
        name: Golden
        swatch: square
        color: "#FFAA00"
      - id: peachy
        name: Peachy
        swatch: square
        color: "#F39B7B"
      - id: sunset
        name: Sunset
        swatch: square
        color: "#D85A2C"
      - id: kiwi
        name: Kiwi
        swatch: square
        color: "#7C3442"
      - id: blush
        name: Blush
        swatch: square
        color: "#E7B0B9"
      - id: harbour
        name: Harbour
        swatch: square
        color: "#A6C1FA"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
iconPosition:
  type: select
  comment: The position of the icon relative to the input field.
  hidden: "!iconName"
  options:
    values:
      - id: before
        name: Before
      - id: after
        name: After
