label:
  type: text
  comment: The label text for the select field.
name:
  type: text
  comment: Name the field is submitted under. Must be unique in the form.
  options:
    required: true
    required_message: Only form elements with a name will have their values passed when submitting a form.
required:
  type: switch
  comment: Whether the field is required.
options:
  type: array
  comment: Array of select options with value and label.
  options:
    structures: _structures.selectOptions
    min_items: 2
    min_items_message: At least two options are required.
placeholder:
  type: text
  comment: Placeholder text for the select field.
value:
  type: text
  comment: The default selected value.
hint:
  type: text
  comment: Help text shown between the label and the field.
autocomplete:
  type: select
  options:
    values: data.autocomplete_tokens
    value_key: id
    allow_create: true
    preview:
      text:
        - key: name
      subtext:
        - key: id
  comment: Autofill hint for browsers. Leave blank to derive it from the field's type and name.
iconName:
  type: select
  comment: Leading icon, from [Heroicons](https://heroicons.com/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
iconColor:
  type: select
  comment: The color of the icon.
  hidden: "!iconName"
  options:
    values:
      - id: default
        name: Default
        preview:
          icon: check_box_outline_blank
      - id: pacific
        name: Pacific
        preview:
          icon: square
          icon_color: "#034AD8"
      - id: moss
        name: Moss
        preview:
          icon: square
          icon_color: "#687E00"
      - id: golden
        name: Golden
        preview:
          icon: square
          icon_color: "#FFAA00"
      - id: peachy
        name: Peachy
        preview:
          icon: square
          icon_color: "#F39B7B"
      - id: sunset
        name: Sunset
        preview:
          icon: square
          icon_color: "#D85A2C"
      - id: kiwi
        name: Kiwi
        preview:
          icon: square
          icon_color: "#7C3442"
      - id: blush
        name: Blush
        preview:
          icon: square
          icon_color: "#E7B0B9"
      - id: harbour
        name: Harbour
        preview:
          icon: square
          icon_color: "#A6C1FA"
