shapes:
  type: array
  comment: The shapes in the pile, each with its own place, size and angle.
designWidth:
  type: number
  comment: The width the positions below are measured in. Rarely changed.
designHeight:
  type: number
  comment: The height the positions below are measured in. Rarely changed.
fall:
  type: switch
  comment: >-
    Drop the shapes into place when the pile is scrolled to. Off leaves the
    pile standing, for one that is a picture beside the copy rather than an
    arrival.
radius:
  type: number
  comment: The corner radius of a square shape, in pixels.
text:
  type: text
  comment: The label on the shape.
image:
  type: image
  comment: >-
    A single-colour mark in place of the label, drawn as a mask so one file
    takes whatever colour the shape gives it.
imageAlt:
  type: text
  comment: What the mark is, for a screen reader. Empty makes it decoration.
imageWidth:
  type: number
  comment: The mark's width, in the same design units as the shape's own.
imageHeight:
  type: number
  comment: The mark's height, in design units.
imageColor:
  type: text
  comment: The mark's colour, by palette name (light-sand, sunset...) or as a hex.
color:
  type: text
  comment: >-
    The sheet's colour by palette name or hex. Out-ranks the three tones
    below, which stay for the piles already built on them.
shadowColor:
  type: text
  comment: >-
    The cast wedge's colour, by palette name or hex. It multiplies into the
    shape under it, so it is a tint rather than a grey.
tone:
  type: select
  comment: Which scratched sheet colours the shape.
  options:
    values:
      - id: golden
        name: Golden
        swatch: square
        color: "#E4A831"
      - id: coral
        name: Coral
        swatch: square
        color: "#E98057"
      - id: rust
        name: Rust
        swatch: square
        color: "#D06522"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
x:
  type: number
  comment: Distance from the left of the pile, in design units.
'y':
  type: number
  comment: Distance from the top of the pile, in design units.
width:
  type: number
  comment: Width of the shape, in design units.
height:
  type: number
  comment: Height of the shape, in design units.
rotation:
  type: number
  comment: The angle it comes to rest at, in degrees.
round:
  type: switch
  comment: Draw it as a circle rather than a rounded card.
lightText:
  type: switch
  comment: White label, for the darker sheets.
fontSize:
  type: number
  comment: Label size, in the same design units as the positions.
strong:
  type: switch
  comment: Draw the label bold.
shadowX:
  type: number
  comment: >-
    The wedge another shape casts onto this one, measured from this shape's own
    top left. Negative where it starts outside and is clipped.
shadowY:
  type: number
  comment: Top of the cast wedge, in design units.
shadowWidth:
  type: number
  comment: Width of the cast wedge. Leave empty for no shadow.
shadowHeight:
  type: number
  comment: How deep the wedge gets at its far edge.
