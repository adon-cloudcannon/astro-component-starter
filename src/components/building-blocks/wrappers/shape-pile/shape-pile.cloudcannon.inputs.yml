arrangement:
  type: select
  comment: >-
    Stacked builds the pile from the floor up, each card sized by its own
    label: add cards and they fall as one row, then wrap into rows above it,
    up to nine. Placed is the hand-drawn arrangement, where every card
    carries its own position, size and angle.
  options:
    values:
      - id: stacked
        name: Stacked
      - id: placed
        name: Placed by hand

shapes:
  type: array
  comment: The shapes in the pile, each with its own place, size and angle.
designWidth:
  type: number
  comment: The width the positions below are measured in. Rarely changed.
designHeight:
  type: number
  comment: The height the positions below are measured in. Rarely changed.
fall:
  type: switch
  comment: >-
    Drop the shapes into place when the pile is scrolled to. Off leaves the
    pile standing, for one that is a picture beside the copy rather than an
    arrival.
radius:
  type: number
  comment: The corner radius of a square shape, in pixels.
text:
  type: text
  comment: The label on the shape.
image:
  type: image
  comment: >-
    A single-colour mark in place of the label, drawn as a mask so one file
    takes whatever colour the shape gives it.
imageAlt:
  type: text
  comment: What the mark is, for a screen reader. Empty makes it decoration.
imageWidth:
  type: number
  comment: The mark's width, in the same design units as the shape's own.
imageHeight:
  type: number
  comment: The mark's height, in design units.
  # The palette as a dropdown, anchored so the other colour fields here share
  # one copy. A key ending in `color` with no input of its own gets a hex
  # picker from CloudCannon's naming convention, which is wrong twice over:
  # the value written is a palette name, not a hex, and a free picker invites
  # colours the theme does not have. The shades are the ones the design uses.
imageColor:
  type: select
  comment: The mark's colour, by palette name (light-sand, sunset...) or as a hex.
  options: &palette-colours
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
    values:
      - id: ""
        name: None
        swatch: check_box_outline_blank
      - id: "pacific"
        name: Pacific
        swatch: square
        color: "#034AD8"
      - id: "pacific-300"
        name: Pacific 300
        swatch: square
        color: "#6B93E6"
      - id: "pacific-100"
        name: Pacific 100
        swatch: square
        color: "#C2D3F7"
      - id: "harbour"
        name: Harbour
        swatch: square
        color: "#A6C1FA"
      - id: "moss"
        name: Moss
        swatch: square
        color: "#687E00"
      - id: "moss-350"
        name: Moss 350
        swatch: square
        color: "#9AAC4D"
      - id: "golden"
        name: Golden
        swatch: square
        color: "#FFAA00"
      - id: "peachy"
        name: Peachy
        swatch: square
        color: "#F39B7B"
      - id: "sunset"
        name: Sunset
        swatch: square
        color: "#D85A2C"
      - id: "blush"
        name: Blush
        swatch: square
        color: "#E7B0B9"
      - id: "kiwi"
        name: Kiwi
        swatch: square
        color: "#7C3442"
      - id: "light-sand"
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: "sand"
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: "dark-sand"
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: "earth"
        name: Earth
        swatch: square
        color: "#6B6157"
      - id: "gray-550"
        name: Gray 550
        swatch: square
        color: "#8A8A8A"
      - id: "midnight"
        name: Midnight
        swatch: square
        color: "#333333"
      - id: "black"
        name: Black
        swatch: square
        color: "#1D1B17"
      - id: "white"
        name: White
        swatch: square
        color: "#FFFFFF"
      # Literals the design states outright rather than by token, kept so
      # the dropdown loses nothing. `#1c1b17` is a unit off black and is
      # probably meant to be it, but a stated value is not ours to restate.
      - id: "#1c1b17"
        name: Near black
        swatch: square
        color: "#1C1B17"
      - id: "#ffecef"
        name: Pale pink
        swatch: square
        color: "#FFECEF"
color:
  type: select
  comment: >-
    The sheet's colour by palette name or hex. Out-ranks the three tones
    below, which stay for the piles already built on them.
  options: *palette-colours
shadowColor:
  type: select
  comment: >-
    The cast wedge's colour, by palette name or hex. It multiplies into the
    shape under it, so it is a tint rather than a grey.
  options: *palette-colours
tone:
  type: select
  comment: Which scratched sheet colours the shape.
  options:
    values:
      - id: golden
        name: Golden
        swatch: square
        color: "#E4A831"
      - id: coral
        name: Coral
        swatch: square
        color: "#E98057"
      - id: rust
        name: Rust
        swatch: square
        color: "#D06522"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
x:
  type: number
  comment: Distance from the left of the pile, in design units.
"y":
  type: number
  comment: Distance from the top of the pile, in design units.
width:
  type: number
  comment: Width of the shape, in design units.
height:
  type: number
  comment: Height of the shape, in design units.
rotation:
  type: number
  comment: The angle it comes to rest at, in degrees.
round:
  type: switch
  comment: Draw it as a circle rather than a rounded card.
lightText:
  type: switch
  comment: White label, for the darker sheets.
fontSize:
  type: number
  comment: Label size, in the same design units as the positions.
strong:
  type: switch
  comment: Draw the label bold.
shadowX:
  type: number
  comment: >-
    The wedge another shape casts onto this one, measured from this shape's own
    top left. Negative where it starts outside and is clipped.
shadowY:
  type: number
  comment: Top of the cast wedge, in design units.
shadowWidth:
  type: number
  comment: Width of the cast wedge. Leave empty for no shadow.
shadowHeight:
  type: number
  comment: How deep the wedge gets at its far edge.
