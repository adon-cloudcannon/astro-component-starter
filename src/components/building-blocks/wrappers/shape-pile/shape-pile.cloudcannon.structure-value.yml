_component: building-blocks/wrappers/shape-pile
arrangement: stacked
designWidth: 664
designHeight: 340
fall: true
radius: 19
shapes:
  - text: A thing you no longer worry about
    tone: golden
  - text: And another
    tone: coral
  - text: And one more
    tone: rust
    lightText: true

# Without this the inputs file beside it is never loaded, and every field on
# the block falls back to CloudCannon guessing a type from its key — which is
# how `panelColor` and the rest came out as hex colour pickers.
_inputs_from_glob:
  - /src/components/building-blocks/wrappers/shape-pile/shape-pile.cloudcannon.inputs.yml
