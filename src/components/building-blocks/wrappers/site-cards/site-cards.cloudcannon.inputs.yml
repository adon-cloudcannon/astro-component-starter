cards:
  type: array
  comment: >-
    The environments, in the order they stack: live site, then staging, then the
    branch.
buttonLabel:
  type: text
  comment: >-
    The pill under the stack, and the connector that runs from it to the live
    card. Leave empty to draw neither.
badge:
  type: text
  comment: The letter in the dark square, e.g. P, T or B.
title:
  type: text
subtitle:
  type: text
  comment: The site the environment belongs to.
domain:
  type: text
  comment: Where it is served, e.g. funky-pear.cloudvent.net.
built:
  type: text
  comment: When it was last built. Leave empty to drop the row, as the live card does.
image:
  type: image
  comment: The screenshot at the top of the card.
  options:
    paths:
      static: ""
      uploads: src/assets/images
imageAlt:
  type: text
  comment: Alt text for it. Leave empty to treat it as decorative.
x:
  type: number
  comment: Distance from the left of the stack, as a fraction of its width.
'y':
  type: number
  comment: Distance from the top, as a fraction of the stack's height.
