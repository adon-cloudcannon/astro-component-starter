label: Browser frame
icon: web_asset
description: A window chrome to put a demo or a mockup inside.
value:
  _component: building-blocks/wrappers/browser-frame
  label: ""
  tone: light
  dots: color

# Without this the inputs file beside it is never loaded, and every field on
# the block falls back to CloudCannon guessing a type from its key — which is
# how `panelColor` and the rest came out as hex colour pickers.
_inputs_from_glob:
  - /src/components/building-blocks/wrappers/browser-frame/browser-frame.cloudcannon.inputs.yml
