name:
  type: text
  comment: The person's name, shown on the badge.
role:
  type: text
  comment: Their role, under the name in the mono face.
imageSource:
  type: image
  comment: >-
    A cut-out photograph with a transparent background. The panel shows through
    behind them, so an ordinary photo with its own background will hide it.
imageAlt:
  type: text
  comment: Alt text. Falls back to the name.
backgroundColor:
  type: select
  label: Panel color
  comment: The scratchy panel behind them.
  options:
    values:
      - id: sunset
        name: Sunset
        preview:
          icon: square
          icon_color: "#D85A2C"
      - id: pacific
        name: Pacific
        preview:
          icon: square
          icon_color: "#034AD8"
      - id: moss
        name: Moss
        preview:
          icon: square
          icon_color: "#687E00"
      - id: golden
        name: Golden
        preview:
          icon: square
          icon_color: "#FFAA00"
      - id: peachy
        name: Peachy
        preview:
          icon: square
          icon_color: "#F39B7B"
      - id: harbour
        name: Harbour
        preview:
          icon: square
          icon_color: "#A6C1FA"
propSource:
  type: image
  comment: What they are holding, overhanging the bottom-right corner.
propAlt:
  type: text
  comment: Alt text for that. Leave empty if it is decoration.
