        icon:
          - key: icon
        fit: contain
propWidth:
  label: Embellishment width
  type: number
  comment: >-
    How wide the drawing is, as a percentage of the panel. The design draws
    the cocktail at 31 and the telephone at 47.
  hidden: "!propSource"
propAlt:
  label: Embellishment alt text
  type: text
  comment: Alt text for the drawing. Leave empty if it is decoration.
