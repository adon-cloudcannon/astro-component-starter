propSource:
  type: select
  label: Embellishment
  # The design system's own Tier 3, plus the two already on pages.
  #
  # Canvas 222:45304 under Illustrations & Graphics names four tiers, and Tier
  # 3 is "Small, conceptual icons used in feature splits, carousels, and
  # supporting areas that need a quick visual to capture a concept." The
  # thirteen of them are drawn in group 222:46835; the cocktail and the
  # telephone are not in that group but are what the pages already prop on a
  # panel, so they are here too.
  #
  # Characters and scenes are deliberately out. A kea or a motorcycle is Tier
  # 1 or 2 artwork with its own placement rules, and at a corner's size it
  # reads as a second subject competing with the person.
  #
  # Four of these bind a per-node crop rather than the upload it came from,
  # because the upload is mostly empty: `layer-25-1.png` is 7% artwork where
  # its crop is 67%. See CLAUDE.md on binding the crop, not the raw file.
  #
  # The saved value is the file's own path, which is what the component already
  # reads, so nothing authored had to move and there is no name-to-file table
  # to keep in step.
  #
  # The drawings are trimmed to their own artwork, under
  # src/assets/images/embellishments, cut from the uploads rather than drawn
  # again. The uploads carry a lot of transparent padding, from 37% artwork on
  # the alarm clock to 100% on the hosting one, and they keep it: a dozen of
  # the Tier 3 boxes in the design frame the padded file, so the pages that
  # draw these in a feature grid still want them as they are. Only the corner
  # of a panel wants them trimmed, where padding is the difference between a
  # drawing that fills its box and one adrift in the middle of it.
  #
  # Trimmed, `embellishmentWidth` means what it says: the width of the drawing,
  # not of a box with a drawing somewhere inside it.
  #
  # The gallery view is what gives the picker somewhere to draw it.
  comment: A spot illustration propped on the bottom-right corner of the panel.
  options:
    values:
      - id: ""
        name: None
        icon: check_box_outline_blank
      - id: /src/assets/images/embellishments/ai.png
        name: AI
        thumb: src/assets/images/embellishments/ai.png
      - id: /src/assets/images/embellishments/alarm-clock.png
        name: Alarm clock
        thumb: src/assets/images/embellishments/alarm-clock.png
      - id: /src/assets/images/embellishments/api.png
        name: API
        thumb: src/assets/images/embellishments/api.png
      - id: /src/assets/images/embellishments/cocktail.png
        name: Cocktail
        thumb: src/assets/images/embellishments/cocktail.png
      - id: /src/assets/images/embellishments/globe.png
        name: Globe
        thumb: src/assets/images/embellishments/globe.png
      - id: /src/assets/images/embellishments/hosting.png
        name: Hosting
        thumb: src/assets/images/embellishments/hosting.png
      - id: /src/assets/images/embellishments/magnet.png
        name: Magnet
        thumb: src/assets/images/embellishments/magnet.png
      - id: /src/assets/images/embellishments/media-library.png
        name: Media library
        thumb: src/assets/images/embellishments/media-library.png
      - id: /src/assets/images/embellishments/page-author.png
        name: Page author
        thumb: src/assets/images/embellishments/page-author.png
      - id: /src/assets/images/embellishments/partner-dashboard.png
        name: Partner dashboard
        thumb: src/assets/images/embellishments/partner-dashboard.png
      - id: /src/assets/images/embellishments/slack.png
        name: Slack
        thumb: src/assets/images/embellishments/slack.png
      - id: /src/assets/images/embellishments/split-preview.png
        name: Split preview
        thumb: src/assets/images/embellishments/split-preview.png
      - id: /src/assets/images/embellishments/telephone.png
        name: Telephone
        thumb: src/assets/images/embellishments/telephone.png
      - id: /src/assets/images/embellishments/translation.png
        name: Translation
        thumb: src/assets/images/embellishments/translation.png
      - id: /src/assets/images/embellishments/window-and-cog.png
        name: Window and cog
