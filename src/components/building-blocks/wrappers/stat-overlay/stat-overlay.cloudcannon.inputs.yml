imageSource:
  type: image
  comment: The picture shown on the panel.
  options:
    paths:
      uploads: src/assets/images
      static: ""
imageAlt:
  type: text
  comment: Alternative text for the picture.
imageAnchor:
  type: select
  comment: Where the picture ends.
  options:
    values:
      - id: foot
        name: Down to the foot
      - id: top
        name: Its own height
imagePlacement:
  type: select
  comment: Where the picture sits on the panel.
  options:
    values:
      - id: inset
        name: Inset from the top left
      - id: center
        name: Centred
imageWidth:
  type: number
  comment: How wide the picture is, as a percentage of the panel.
panelImage:
  type: image
  comment: A picture for the panel itself, behind everything.
  options:
    paths:
      uploads: src/assets/images
      static: ""
  # The palette as a dropdown, anchored so the other colour fields here share
  # one copy. A key ending in `color` with no input of its own gets a hex
  # picker from CloudCannon's naming convention, which is wrong twice over:
  # the value written is a palette name, not a hex, and a free picker invites
  # colours the theme does not have. The shades are the ones the design uses.
panelColor:
  type: select
  comment: A palette colour for the panel when it carries no picture.
  options: &palette-colours
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
    values:
      - id: ""
        name: None
        swatch: check_box_outline_blank
      - id: "pacific"
        name: Pacific
        swatch: square
        color: "#034AD8"
      - id: "pacific-300"
        name: Pacific 300
        swatch: square
        color: "#6B93E6"
      - id: "pacific-100"
        name: Pacific 100
        swatch: square
        color: "#C2D3F7"
      - id: "harbour"
        name: Harbour
        swatch: square
        color: "#A6C1FA"
      - id: "moss"
        name: Moss
        swatch: square
        color: "#687E00"
      - id: "moss-350"
        name: Moss 350
        swatch: square
        color: "#9AAC4D"
      - id: "golden"
        name: Golden
        swatch: square
        color: "#FFAA00"
      - id: "peachy"
        name: Peachy
        swatch: square
        color: "#F39B7B"
      - id: "sunset"
        name: Sunset
        swatch: square
        color: "#D85A2C"
      - id: "blush"
        name: Blush
        swatch: square
        color: "#E7B0B9"
      - id: "kiwi"
        name: Kiwi
        swatch: square
        color: "#7C3442"
      - id: "light-sand"
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: "sand"
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: "dark-sand"
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: "earth"
        name: Earth
        swatch: square
        color: "#6B6157"
      - id: "gray-550"
        name: Gray 550
        swatch: square
        color: "#8A8A8A"
      - id: "midnight"
        name: Midnight
        swatch: square
        color: "#333333"
      - id: "black"
        name: Black
        swatch: square
        color: "#1D1B17"
      - id: "white"
        name: White
        swatch: square
        color: "#FFFFFF"
panelScratch:
  type: text
  comment: >-
    Draws the panel's scratched sheet in this colour instead of loading an
    export. A palette name or a hex.
panelScratchInk:
  type: text
  comment: >-
    What a scratch shows. Left empty it is the panel colour lifted toward
    white, which is how the exported sheets read.
stats:
  type: array
  comment: The callouts laid over the panel.
statsPosition:
  type: select
  comment: Which side of the panel they sit on.
  options:
    values:
      - id: end
        name: Right
      - id: start
        name: Left
statsAlign:
  type: select
  comment: How they distribute down the panel.
  options:
    values:
      - id: start
        name: From the top
      - id: center
        name: Centred
      - id: end
        name: From the bottom
      - id: between
        name: Apart
panelFit:
  type: select
  comment: >-
    Whether the panel is a card of its own shape, or fills whatever holds it.
    High Performance draws the sheet as the whole half of the band, square
    cornered, with the copy side painted over it.
  options:
    values:
      - id: card
        name: A card of its own shape
      - id: fill
        name: Edge to edge
ratioWidth:
  type: number
  comment: The panel's shape as a card, width.
ratioHeight:
  type: number
  comment: The panel's shape as a card, height.
number:
  type: number
  comment: The figure. It counts up to this when the panel is scrolled to.
prefix:
  type: text
  comment: Shown before the figure.
suffix:
  type: text
  comment: Shown after the figure, e.g. x, %, +.
label:
  type: text
  comment: What the figure measures.
iconName:
  type: select
  comment: The mark shown beside the figure. Sourced from [Lucide](https://lucide.dev/icons/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
iconColor:
  type: select
  comment: A palette colour for the mark.
  hidden: "!iconName"
  options:
    values:
      - id: ""
        name: Default
        swatch: check_box_outline_blank
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
      - id: moss
        name: Moss
        swatch: square
        color: "#687E00"
      - id: golden
        name: Golden
        swatch: square
        color: "#FFAA00"
      - id: peachy
        name: Peachy
        swatch: square
        color: "#F39B7B"
      - id: sunset
        name: Sunset
        swatch: square
        color: "#D85A2C"
      - id: kiwi
        name: Kiwi
        swatch: square
        color: "#7C3442"
      - id: blush
        name: Blush
        swatch: square
        color: "#E7B0B9"
      - id: harbour
        name: Harbour
        swatch: square
        color: "#A6C1FA"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
