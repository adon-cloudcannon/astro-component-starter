label: Stat overlay
icon: insights
description: A picture on a panel, with stat callouts laid over it.
value:
  _component: building-blocks/wrappers/stat-overlay
  imageSource: ""
  imageAlt: ""
  imageAnchor: foot
  imagePlacement: inset
  imageWidth: 62
  panelImage: ""
  panelColor: ""
  statsPosition: end
  statsAlign: center
  stats:
    - number: 100
      prefix: ""
      suffix: x
      label: publishing velocity
      iconName: zap
      iconColor: moss

# Without this the inputs file beside it is never loaded, and every field on
# the block falls back to CloudCannon guessing a type from its key — which is
# how `panelColor` and the rest came out as hex colour pickers.
_inputs_from_glob:
  - /src/components/building-blocks/wrappers/stat-overlay/stat-overlay.cloudcannon.inputs.yml
