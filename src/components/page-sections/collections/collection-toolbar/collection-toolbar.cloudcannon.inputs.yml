# The two tabs. A structure value draws its first-level nested keys as tabs
# when it sets `tabbed: true`; `groups` only ever draws as accordions. The
# subtype is pinned so the tabbing stops here — left unsaid these inherit it,
# and then every field inside them has to be an object too.
content:
  type: object
  label: Content
  options:
    subtype: object
style:
  type: object
  label: Style
  comment: What paints the band.
  options:
    subtype: object

content.collection:
  type: text
  label: Collection name
  comment: >-
    The name of the card grid this filters. The grid carries the same name, so
    the two can sit in different sections and still find each other.
content.searchLabel:
  type: text
  comment: What the search field is announced as. Not shown.
content.searchPlaceholder:
  type: text
  comment: The grey text in the empty search field.
content.sortLabel:
  type: text
  comment: The label on the button at the end of the search field. Leave empty for none.
content.filters:
  type: array
  label: Filters
  comment: One dropdown each, drawn after the search field.
  options:
    structures: _structures.collectionFilters

# --- section wrapper inputs (CustomSection) ---
content.sectionLabel:
  type: text
  comment: Names the section in the editor and sets its anchor id.
style.maxContentWidth:
  type: select
  comment: >-
    How wide the band's content runs. Full is the 1040 content column; compact
    is 768, which still holds a heading beside a row of marks.
  options:
    values:
      - id: xl
        name: Full
      - id: lg
        name: Compact
style.paddingHorizontal:
  type: select
  comment: The space either side of the content.
  options:
    values:
      - id: gutter
        name: Default page gutter
      - id: none
        name: None
style.paddingVertical:
  type: select
  comment: The space above and below the content.
  options:
    values:
      - id: lg
        name: Default
      - id: md
        name: Compact
style.paddingVerticalStart:
  type: select
  comment: >-
    Overrides the padding above the row. `none` runs it straight on from the
    band above, which is how the design joins it to the hero.
  options:
    values: [none, xs, sm, md, lg, xl, 2xl, 3xl, 4xl, 5xl, 6xl]
style.paddingVerticalEnd:
  type: select
  comment: Overrides the padding below the row.
  options:
    values: [none, xs, sm, md, lg, xl, 2xl, 3xl, 4xl, 5xl, 6xl]
style.backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
