label: Pricing Tiers
icon: payments
description: Plan cards with features, a highlighted plan, and a monthly/annual switch.
tabbed: true
value:
  _component: page-sections/conversion/pricing-tiers
  content:
    sectionLabel: ''
    eyebrow: Plans
    heading: Simple pricing that scales with you
    headingLevel: h2
    subtext: Every plan includes global CDN hosting and automatic SSL.
    subtextSize: md
    subtextWidth: ''
    showAnnualPricing: false
    monthlyLabel: Monthly
    annualLabel: Annual
    annualBadge: ''
    defaultInterval: monthly
    tiers:
      - name: Starter
        price: $19
        priceSuffix: /month
        annualPrice: ''
        annualPriceSuffix: /year
        description: For a single marketing site.
        features:
          - text: 1 site
            included: true
          - text: 1 seat
            included: true
          - text: CDN + SSL
            included: true
          - text: Form endpoints
            included: false
          - text: Staging environment
            included: false
        buttonText: Get started
        buttonLink: '#'
        highlight: false
        badgeText: ''
      - name: Studio
        price: $59
        priceSuffix: /month
        annualPrice: ''
        annualPriceSuffix: /year
        description: For small teams shipping several sites.
        features:
          - text: 10 sites
            included: true
          - text: 5 seats
            included: true
          - text: Form endpoints
            included: true
          - text: Staging environment
            included: true
          - text: SSO
            included: false
        buttonText: Get started
        buttonLink: '#'
        highlight: true
        badgeText: Most popular
      - name: Agency
        price: $149
        priceSuffix: /month
        annualPrice: ''
        annualPriceSuffix: /year
        description: For agencies running client fleets.
        features:
          - text: Unlimited sites
            included: true
          - text: SSO + audit log
            included: true
          - text: Named support contact
            included: true
          - text: 99.95% uptime SLA
            included: true
        buttonText: Talk to sales
        buttonLink: '#'
        highlight: false
        badgeText: ''
  style:
    backgroundColor: light-sand
    pattern: none
    fade: none
    maxContentWidth: xl
    paddingHorizontal: gutter
    paddingVertical: 4xl
    haze: false
preview:
  text:
    - Pricing Tiers
  subtext:
    - key: content.heading
  image: public/component-previews/page-sections/conversion/pricing-tiers.svg
  icon: payments
picker_preview:
  text: Pricing Tiers
  subtext: >-
    Plan comparison cards with feature checklists, a highlighted tier, and an optional
    monthly/annual billing switch.
  image: public/component-previews/page-sections/conversion/pricing-tiers.svg
_inputs_from_glob:
  - /src/components/page-sections/conversion/pricing-tiers/pricing-tiers.cloudcannon.inputs.yml
_structures:
  pricingTiers:
    values:
      - label: Tier
        icon: payments
        value:
          name: Plan name
          price: $29
          priceSuffix: /month
          annualPrice: ''
          annualPriceSuffix: /year
          description: Who this plan is for.
          features:
            - text: Included feature
              included: true
          buttonText: Get started
          buttonLink: '#'
          highlight: false
          badgeText: ''
          accent: ''
        preview:
          text:
            - key: name
            - Tier
          subtext:
            - key: price
        _inputs:
          name:
            type: text
            comment: Name of the plan.
          price:
            type: text
            comment: >-
              The price, including the currency symbol (e.g. $19). Shown on the monthly option, and
              whenever annual pricing is off.
          priceSuffix:
            type: text
            comment: Billing period shown after the price (e.g. /month). Leave empty to hide.
          annualPrice:
            type: text
            comment: >-
              Optional annual price (e.g. $190). Used when Annual pricing is on. Leave empty to keep
              showing the monthly price in both modes.
          annualPriceSuffix:
            type: text
            comment: Billing period shown after the annual price (e.g. /year). Leave empty to hide.
            hidden: '!annualPrice'
          description:
            type: text
            comment: One line on who the plan is for.
          features:
            type: array
            label: Features
            comment: >-
              Feature checklist. Excluded rows render muted with a dash so the lists align across
              tiers.
            options:
              structures: _structures.pricingTierFeatures
          buttonText:
            type: text
            comment: Call-to-action button label.
          buttonLink:
            type: url
            comment: Where the call-to-action button links.
          highlight:
            type: switch
            comment: Emphasize this tier with a stronger border, shadow, filled button, and the badge.
          badgeText:
            type: text
            comment: Badge shown atop the card (e.g. Most popular).
            hidden: '!highlight'
  pricingTierFeatures:
    values:
      - label: Feature
        icon: check
        value:
          text: Feature
          included: true
        preview:
          text:
            - key: text
            - Feature
        _inputs:
          text:
            type: text
            comment: The feature name.
          included:
            type: switch
            comment: Whether this plan includes the feature.
