eyebrow:
  type: text
  comment: Short label above the heading.
heading:
  type: text
  comment: Main heading for the section.
headingSize:
  type: select
  comment: Size of the title, independent of its level.
  options:
    values:
      - id: 2xl
        name: Header 1
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
      - id: sm
        name: Header 5
      - id: xs
        name: Header 6
headingLevel:
  type: select
  comment: Heading level for the title. Use h1 once per page, on the first section.
  options:
    values:
      - h1
      - h2
      - h3
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
alignmentHorizontal:
  type: select
  comment: Whether the header is centred over the tiers or runs from the left.
  options:
    values:
      - id: center
        name: Center
      - id: start
        name: Start
subtextSize:
  type: select
  comment: Body 3 at 19 or Subtitle 1 at 22 in the design; regular is 16.
  options:
    values:
      - id: md
        name: Regular
      - id: lg
        name: Large
      - id: xl
        name: Extra large
subtextWidth:
  type: number
  comment: >-
    Measure for the supporting line, in pixels. The design sets a centred one
    at about 580 rather than the full column. Leave empty for the full width.
showAnnualPricing:
  type: switch
  comment: Shows a Monthly/Annual toggle above the cards. Tiers can then set an annual price.
monthlyLabel:
  type: text
  comment: Label before the billing toggle, for monthly pricing.
  hidden: "!showAnnualPricing"
annualLabel:
  type: text
  comment: Label after the billing toggle, for annual pricing.
  hidden: "!showAnnualPricing"
annualBadge:
  type: text
  comment: Saving shown in brackets after the annual label, e.g. "save 17%".
  hidden: "!showAnnualPricing"
defaultInterval:
  type: select
  comment: Which billing option is selected when the page loads.
  hidden: "!showAnnualPricing"
  options:
    values:
      - id: monthly
        name: Monthly
      - id: annual
        name: Annual
tiers:
  type: array
  label: Tiers
  comment: Plan cards rendered in the grid.
  options:
    structures: _structures.pricingTiers

# --- section wrapper inputs (CustomSection) ---
# Configures the CustomSection wrapper, not this section's own content. Inline
# per component so a project can trim the size/padding lists in place.
# `new:component` slices from this marker down — keep the marker line verbatim.
sectionLabel:
  type: text
  comment: Names the section in the editor and sets its anchor id.
maxContentWidth:
  type: select
  comment: Maximum width of the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingHorizontal:
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: gutter
        name: Page gutter
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingVertical:
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
      - id: 6xl
        name: 6xl
colorScheme:
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
backgroundColor:
  type: select
  comment: Background color for the section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight

haze:
  type: switch
  comment: >-
    Pools the section's own background colour behind the content and blurs it,
    so a heading stays readable where an illustration or a pattern runs
    underneath.
