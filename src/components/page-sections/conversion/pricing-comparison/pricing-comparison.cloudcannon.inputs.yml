eyebrow:
  type: text
  comment: Short label above the heading.
heading:
  type: text
  comment: Main heading for the section.
headingSize:
  type: select
  comment: Size of the title, independent of its level.
  options:
    values:
      - id: 2xl
        name: Header 1
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
      - id: sm
        name: Header 5
      - id: xs
        name: Header 6
headingLevel:
  type: select
  comment: Heading level for the title. Use h1 once per page, on the first section.
  options:
    values:
      - h1
      - h2
      - h3
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
plans:
  type: array
  label: Plans
  comment: The columns of the table, left to right. One plan can be highlighted.
  options:
    structures: _structures.pricingComparisonPlans
rows:
  type: array
  label: Feature rows
  comment: One row per feature, with one value per plan in plan order.
  options:
    structures: _structures.pricingComparisonRows
striped:
  type: switch
  comment: Shade alternate rows to help the eye track across the table.

# --- section wrapper inputs (CustomSection) ---
# Configures the CustomSection wrapper, not this section's own content. Inline
# per component so a project can trim the size/padding lists in place.
# `new:component` slices from this marker down — keep the marker line verbatim.
sectionLabel:
  type: text
  comment: Names the section in the editor and sets its anchor id.
maxContentWidth:
  type: select
  comment: Maximum width of the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingHorizontal:
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: gutter
        name: Page gutter
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingVertical:
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
      - id: 6xl
        name: 6xl
colorScheme:
  hidden: true
  # Carried by the band colour. Every band the design draws names its own ink,
  # and `base` on its own does not say whether you get the cream band or the
  # near-black one — which is why this and the lock had to agree with a third
  # field on every dark section.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  hidden: true
  # Carried by the band colour: every named band locks, because there is no
  # dark mode here for an unlocked one to follow.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name