picker_preview:
  text: Testimonial Bento
  subtext: Customer quotes in a bento grid, led by one featured quote.
  image: public/component-previews/page-sections/proof/testimonial-bento.svg
  icon: dashboard
  gallery:
    image: public/component-previews/page-sections/proof/testimonial-bento.svg
    fit: cover
_inputs_from_glob:
  - /src/components/page-sections/proof/testimonial-bento/testimonial-bento.cloudcannon.inputs.yml
  - /.cloudcannon/inputs/background.yml
  - /.cloudcannon/inputs/haze.yml
_structures:
  testimonialBentoItems:
    values:
      - label: Testimonial
        icon: format_quote
        value:
          company: ""
          logo: ""
          logoAlt: ""
          text: ""
          authorName: ""
          authorDescription: ""
          authorImage: ""
          linkText: ""
          link: ""
          accentColor: ""
          size: standard
          quoteSize: standard
          tone: base
        preview:
          text:
            - key: authorName
            - Testimonial
          subtext:
            - key: text
          icon: format_quote
        _inputs:
          company:
            type: text
            comment: Who said it, shown above the quote where there is no logo.
          logo:
            type: image
            comment: The customer's wordmark, shown instead of their name.
          logoAlt:
            type: text
            comment: Alt text for the logo.
          accentColor:
            type: select
            comment: >-
              The card's colour. It does three jobs at once: the emphasised
              words in the quote take it, the card's border shows in it on
              hover, and the link turns to it on hover.
            options:
              values:
                - id: ""
                  name: None
                  swatch: check_box_outline_blank
                - id: sunset
                  name: Sunset
                  swatch: square
                  color: "#D85A2C"
                - id: golden
                  name: Golden
                  swatch: square
                  color: "#FFAA00"
                - id: pacific
                  name: Pacific
                  swatch: square
                  color: "#034AD8"
                - id: moss
                  name: Moss
                  swatch: square
                  color: "#687E00"
                - id: peachy
                  name: Peachy
                  swatch: square
                  color: "#F39B7B"
                - id: harbour
                  name: Harbour
                  swatch: square
                  color: "#A6C1FA"
              picker_view: card
              preview:
                icon:
                  - key: swatch
                icon_color:
                  - key: color
                text:
                  - key: name
          linkText:
            type: text
            comment: Label for the link at the foot of the card, e.g. "Read case study".
          link:
            type: url
            comment: Where that link goes.
          text:
            type: markdown
            comment: >-
              The quote itself. Bold picks words out in the card's accent
              colour, which is how the design highlights a result.
          authorName:
            type: text
            comment: Who said it.
          authorDescription:
            type: text
            comment: Their role and company. Leave empty to hide.
          authorImage:
            type: image
            comment: Optional headshot. Falls back to the author's initials.
            options:
              paths:
                static: ""
                uploads: src/assets/images
          quoteSize:
            type: select
            comment: The quote's own size. Large is 28px against the standard 24px.
            options:
              values:
                - id: standard
                  name: Standard (24px)
                - id: large
                  name: Large (28px)
          size:
            type: select
            comment: How much of the grid this quote takes. Featured is two columns by two rows, and Full width spans the whole row. On small screens every quote is full width.
            options:
              values:
                - id: standard
                  name: Standard (1 × 1)
                - id: wide
                  name: Wide (2 × 1)
                - id: tall
                  name: Tall (1 × 2)
                - id: featured
                  name: Featured (2 × 2)
                - id: full
                  name: Full width
          tone:
            type: select
            comment: >-
              Which ground the card is drawn on. There are two: the dark one
              the design mostly uses, and the pale one for the card it marks
              out. The accent travels with the ground rather than being set
              separately, because Harbour and Golden are tuned to glow on
              near-black and all but vanish on a pale card.
            options:
              values:
                - id: base
                  name: Dark
                  swatch: square
                  color: "#252423"
                - id: light
                  name: Light
                  swatch: square
                  color: "#FFFCF3"
              picker_view: card
              preview:
                icon:
                  - key: swatch
                icon_color:
                  - key: color
                text:
                  - key: name
groups:
  - heading: Content
    inputs:
      - eyebrow
      - heading
      - subtext
      - subtextSize
      - subtextWidth
      - testimonials
      - columns
  - heading: Section settings
    comment: Width, spacing, color scheme, and background for this section.
    collapsed: true
    inputs:
      - sectionLabel
      - headingLevel
      - maxContentWidth
      - paddingHorizontal
      - paddingVertical
      - backgroundColor
      - background
      - haze
