# The two tabs. A structure value draws its first-level nested keys as tabs
# when it sets `tabbed: true`; `groups` only ever draws as accordions. The
# subtype is pinned so the tabbing stops here — left unsaid these inherit it,
# and then every field inside them has to be an object too.
content:
  type: object
  label: Content
  options:
    subtype: object
style:
  type: object
  label: Style
  comment: What paints the band.
  options:
    subtype: object

# The heading, its eyebrow, its level and its size are one decision.
content.heading:
  type: object
  label: Heading
  options:
    subtype: object
content.heading.eyebrow:
  type: text
  comment: Short label above the heading.
content.heading.heading:
  type: text
  comment: Main heading for the section.
content.heading.headingSize:
  type: select
  comment: Size of the title, independent of its level.
  options:
    values:
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
      - id: sm
        name: Header 5
content.heading.headingLevel:
  type: select
  comment: Heading level for the title. Use h1 once per page, on the first section.
  options:
    values: [h1, h2, h3]
content.subtext:
  type: object
  label: Subtext
  options:
    subtype: object
content.subtext.subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
content.subtext.subtextSize:
  type: select
  comment: How big the supporting line under the heading is.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large
content.subtext.subtextWidth:
  type: select
  label: Subtext width
  comment: How wide the supporting line is allowed to run before it wraps.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide
content.buttonSections:
  type: array
  comment: Actions under the copy.
content.imageSource:
  type: image
  comment: The picture shown on the panel.
  options:
    paths:
      uploads: src/assets/images
      static: ""
content.imageAlt:
  type: text
  comment: Alternative text for the picture.
content.imageAnchor:
  type: select
  comment: Where the picture ends.
  options:
    values:
      - id: foot
        name: Down to the foot
      - id: top
        name: Its own height
style.panelImage:
  type: image
  comment: Leave empty to use a flat colour instead.
  options:
    paths:
      uploads: src/assets/images
      static: ""
  # The palette as a dropdown, anchored so the other colour fields here share
  # one copy. A key ending in `color` with no input of its own gets a hex
  # picker from CloudCannon's naming convention, which is wrong twice over:
  # the value written is a palette name, not a hex, and a free picker invites
  # colours the theme does not have. The shades are the ones the design uses.
style.panelColor:
  type: select
  comment: >-
    A palette colour for the panel when it carries no picture, e.g. moss,
    pacific, sunset.
  options: &palette-colours
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
    values:
      - id: ""
        name: None
        swatch: check_box_outline_blank
      - id: "pacific"
        name: Pacific
        swatch: square
        color: "#034AD8"
      - id: "pacific-300"
        name: Pacific 300
        swatch: square
        color: "#6B93E6"
      - id: "pacific-100"
        name: Pacific 100
        swatch: square
        color: "#C2D3F7"
      - id: "harbour"
        name: Harbour
        swatch: square
        color: "#A6C1FA"
      - id: "moss"
        name: Moss
        swatch: square
        color: "#687E00"
      - id: "moss-350"
        name: Moss 350
        swatch: square
        color: "#9AAC4D"
      - id: "golden"
        name: Golden
        swatch: square
        color: "#FFAA00"
      - id: "peachy"
        name: Peachy
        swatch: square
        color: "#F39B7B"
      - id: "sunset"
        name: Sunset
        swatch: square
        color: "#D85A2C"
      - id: "blush"
        name: Blush
        swatch: square
        color: "#E7B0B9"
      - id: "kiwi"
        name: Kiwi
        swatch: square
        color: "#7C3442"
      - id: "light-sand"
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: "sand"
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: "dark-sand"
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: "earth"
        name: Earth
        swatch: square
        color: "#6B6157"
      - id: "gray-550"
        name: Gray 550
        swatch: square
        color: "#8A8A8A"
      - id: "midnight"
        name: Midnight
        swatch: square
        color: "#333333"
      - id: "black"
        name: Black
        swatch: square
        color: "#1D1B17"
      - id: "white"
        name: White
        swatch: square
        color: "#FFFFFF"
content.panelScratched:
  type: switch
  label: Scratched
  comment: >-
    Scratches through the panel's colour, the way the design's panels are.
    The colour is the one above; the scratches show the page through it.
content.panelScratchInk:
  type: text
  comment: >-
    What a scratch shows. Left empty it is the panel colour lifted toward
    white.
content.stats:
  type: array
  comment: The callouts laid over the panel.
content.statsPosition:
  type: select
  comment: Which side of the panel they sit on.
  options:
    values:
      - id: end
        name: Right
      - id: start
        name: Left
content.statsAlign:
  type: select
  comment: >-
    How they distribute down the panel. Centre suits one, apart suits two,
    top suits three.
  options:
    values:
      - id: start
        name: From the top
      - id: center
        name: Centred
      - id: end
        name: From the bottom
      - id: between
        name: Apart
content.number:
  type: number
  comment: The figure. It counts up to this when the panel is scrolled to.
content.prefix:
  type: text
  comment: Shown before the figure, e.g. a currency mark.
content.suffix:
  type: text
  comment: Shown after the figure, e.g. x, %, +.
content.label:
  type: text
  comment: What the figure measures.
content.iconName:
  type: select
  comment: The mark shown beside the figure. Sourced from [Lucide](https://lucide.dev/icons/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
content.iconColor:
  type: select
  comment: A palette colour for the mark.
  hidden: "!iconName"
  options:
    values:
      - id: ""
        name: Default
        swatch: check_box_outline_blank
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
      - id: moss
        name: Moss
        swatch: square
        color: "#687E00"
      - id: golden
        name: Golden
        swatch: square
        color: "#FFAA00"
      - id: peachy
        name: Peachy
        swatch: square
        color: "#F39B7B"
      - id: sunset
        name: Sunset
        swatch: square
        color: "#D85A2C"
      - id: kiwi
        name: Kiwi
        swatch: square
        color: "#7C3442"
      - id: blush
        name: Blush
        swatch: square
        color: "#E7B0B9"
      - id: harbour
        name: Harbour
        swatch: square
        color: "#A6C1FA"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
