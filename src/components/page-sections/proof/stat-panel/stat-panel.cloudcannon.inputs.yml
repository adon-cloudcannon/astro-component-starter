eyebrow:
  type: text
  comment: Short label above the heading.
heading:
  type: text
  comment: Main heading for the section.
headingSize:
  type: select
  comment: Size of the title, independent of its level.
  options:
    values:
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
      - id: sm
        name: Header 5
headingLevel:
  type: select
  comment: Heading level for the title. Use h1 once per page, on the first section.
  options:
    values: [h1, h2, h3]
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
subtextSize:
  type: select
  comment: >-
    How big the supporting line under the heading is. Regular is the size the
    design uses on most sections.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large
subtextWidth:
  type: select
  label: Subtext width
  comment: >-
    How wide the supporting line is allowed to run before it wraps. The design
    keeps a centred one around Medium rather than letting it run the full
    width of the section.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide
buttonSections:
  type: array
  comment: Actions under the copy.
imageSource:
  type: image
  comment: The picture shown on the panel.
  options:
    paths:
      uploads: src/assets/images
      static: ""
imageAlt:
  type: text
  comment: Alternative text for the picture.
imageAnchor:
  type: select
  comment: >-
    Where the picture ends. To the foot runs it down to the panel's bottom
    edge and lets the panel cut it off, which is how the design draws it.
  options:
    values:
      - id: foot
        name: Down to the foot
      - id: top
        name: Its own height
panelImage:
  type: image
  comment: >-
    A picture for the panel itself, behind everything — the scratched sheet the
    design paints it with. Leave empty to use a flat colour instead.
  options:
    paths:
      uploads: src/assets/images
      static: ""
panelColor:
  type: text
  comment: >-
    A palette colour for the panel when it carries no picture, e.g. moss,
    pacific, sunset.
panelScratch:
  type: text
  comment: >-
    Draws the panel's scratched sheet in this colour instead of loading an
    export. A palette name or a hex.
panelScratchInk:
  type: text
  comment: >-
    What a scratch shows. Left empty it is the panel colour lifted toward
    white.
stats:
  type: array
  comment: The callouts laid over the panel.
statsPosition:
  type: select
  comment: Which side of the panel they sit on.
  options:
    values:
      - id: end
        name: Right
      - id: start
        name: Left
statsAlign:
  type: select
  comment: >-
    How they distribute down the panel. Centre suits one, apart suits two,
    top suits three.
  options:
    values:
      - id: start
        name: From the top
      - id: center
        name: Centred
      - id: end
        name: From the bottom
      - id: between
        name: Apart
number:
  type: number
  comment: The figure. It counts up to this when the panel is scrolled to.
prefix:
  type: text
  comment: Shown before the figure, e.g. a currency mark.
suffix:
  type: text
  comment: Shown after the figure, e.g. x, %, +.
label:
  type: text
  comment: What the figure measures.
iconName:
  type: select
  comment: The mark shown beside the figure. Sourced from [Heroicons](https://heroicons.com/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
iconColor:
  type: select
  comment: A palette colour for the mark.
  hidden: "!iconName"
  options:
    values:
      - id: ""
        name: Default
        swatch: check_box_outline_blank
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
      - id: moss
        name: Moss
        swatch: square
        color: "#687E00"
      - id: golden
        name: Golden
        swatch: square
        color: "#FFAA00"
      - id: peachy
        name: Peachy
        swatch: square
        color: "#F39B7B"
      - id: sunset
        name: Sunset
        swatch: square
        color: "#D85A2C"
      - id: kiwi
        name: Kiwi
        swatch: square
        color: "#7C3442"
      - id: blush
        name: Blush
        swatch: square
        color: "#E7B0B9"
      - id: harbour
        name: Harbour
        swatch: square
        color: "#A6C1FA"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
