# The two tabs. A structure value draws its first-level nested keys as tabs
# when it sets `tabbed: true`; `groups` only ever draws as accordions. The
# subtype is pinned so the tabbing stops here — left unsaid these inherit it,
# and then every field inside them has to be an object too.
content:
  type: object
  label: Content
  options:
    subtype: object
style:
  type: object
  label: Style
  comment: What paints the band.
  options:
    subtype: object

content.eyebrow:
  type: text
  comment: Short label above the heading. Optional.
content.heading:
  type: text
  comment: The section's title, centred.
content.headingLevel:
  type: select
  comment: Heading level for the title.
  options:
    values:
      - h2
      - h3
content.headingSize:
  type: select
  comment: >-
    Size of the title, independent of its level. The design draws Header 3
    here.
  options:
    values:
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
content.subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
content.subtextSize:
  type: select
  comment: >-
    How big the supporting line under the heading is. Regular is the size the
    design uses on most sections.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large
content.subtextWidth:
  type: select
  label: Subtext width
  comment: >-
    How wide the supporting line is allowed to run before it wraps. The design
    keeps a centred one around Medium rather than letting it run the full
    width of the section.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide
content.leads:
  type: array
  label: With a biography
  comment: >-
    The people drawn larger, with a paragraph under the name. Three across in
    the design.
  options:
    structures: _structures.teamMember
content.members:
  type: array
  comment: >-
    Everyone else, with the name on a badge over the card. Four across in the
    design.
  options:
    structures: _structures.teamMember

# --- section wrapper inputs
content.sectionLabel:
  type: text
  comment: Accessible name for the section, used by screen readers.
style.maxContentWidth:
  hidden: true
  # Set from the design, not by an editor.
  type: select
  comment: Maximum width of the content.
  options:
    values:
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
style.paddingHorizontal:
  hidden: true
  # Set from the design, not by an editor.
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: gutter
        name: Page gutter
      - id: lg
        name: Large
style.paddingVertical:
  hidden: true
  # Set from the design, not by an editor.
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
style.colorScheme:
  hidden: true
  # Carried by the band colour.
  type: select
  comment: Light or dark scheme for the section.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
style.lockColorScheme:
  hidden: true
  # Carried by the band colour.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle.
style.backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
