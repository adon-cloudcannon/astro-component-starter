# The two tabs. A structure value draws its first-level nested keys as tabs
# when it sets `tabbed: true`; `groups` only ever draws as accordions. The
# subtype is pinned so the tabbing stops here — left unsaid these inherit it,
# and then every field inside them has to be an object too.
content:
  type: object
  label: Content
  options:
    subtype: object
style:
  type: object
  label: Style
  comment: What paints the band.
  options:
    subtype: object

# The heading, its eyebrow, its level and its size are one decision.
content.heading:
  type: object
  label: Heading
  options:
    subtype: object
content.heading.eyebrow:
  type: text
  comment: Short label above the heading. Optional.
content.heading.heading:
  type: text
  comment: The section's title, centred.
content.heading.headingLevel:
  type: select
  comment: Heading level for the title.
  options:
    values:
      - h2
      - h3
content.heading.headingSize:
  type: select
  comment: Size of the title, independent of its level.
  options:
    values:
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
content.subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
content.subtextSize:
  type: select
  comment: How big the supporting line under the heading is.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large
content.subtextWidth:
  type: select
  label: Subtext width
  comment: How wide the supporting line is allowed to run before it wraps.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide
content.leads:
  type: array
  label: With a biography
  comment: The people drawn larger, with a paragraph under the name.
  options:
    structures: _structures.teamMember
content.members:
  type: array
  comment: Everyone else, with the name on a badge over the card.
  options:
    structures: _structures.teamMember

# --- section wrapper inputs
content.sectionLabel:
  type: text
  comment: Accessible name for the section, used by screen readers.
style.maxContentWidth:
  hidden: true
  # Set from the design, not by an editor.
  type: select
  comment: How wide the band's content runs.
  options:
    values:
      - id: xl
        name: Full
      - id: lg
        name: Compact
style.paddingHorizontal:
  hidden: true
  # Set from the design, not by an editor.
  type: select
  comment: The space either side of the content.
  options:
    values:
      - id: gutter
        name: Default page gutter
      - id: none
        name: None
style.paddingVertical:
  hidden: true
  # Set from the design, not by an editor.
  type: select
  comment: The space above and below the content.
  options:
    values:
      - id: 4xl
        name: Default
      - id: md
        name: Compact
style.colorScheme:
  hidden: true
  # Carried by the band colour.
  type: select
  comment: Light or dark scheme for the section.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
style.lockColorScheme:
  hidden: true
  # Carried by the band colour.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle.
style.pattern:
  type: select
  label: Texture
  comment: The pattern drawn behind the band, inked from the band's own colours.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: grid
        name: Grid
        swatch: grid_4x4
      - id: pegboard
        name: Peg board
        swatch: blur_linear
    picker_view: card
    preview:
      icon:
        - key: swatch
      text:
        - key: name
style.fade:
  type: select
  label: Texture fade
  comment: Which edge the texture fades out towards. Only applies where there is one.
  options:
    values:
      - id: none
        name: None
      - id: top
        name: Fade out at the top
      - id: bottom
        name: Fade out at the bottom
style.haze:
  type: switch
  label: Haze behind the heading
  comment: >-
    Pools the band's own colour behind the copy and blurs it, so the heading
    stays readable where the pattern runs under it.
style.backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
