label: Logo Cloud
icon: workspaces
description: Row of client logos, with an optional heading.
value:
  _component: page-sections/proof/logo-cloud
  sectionLabel: ""
  heading: Trusted by teams shipping every day
  logos:
    - image: /src/assets/images/component-docs/logo-acme.svg
      alt: Acme
      url: ""
    - image: /src/assets/images/component-docs/logo-northwind.svg
      alt: Northwind
      url: ""
    - image: /src/assets/images/component-docs/logo-globex.svg
      alt: Globex
      url: ""
    - image: /src/assets/images/component-docs/logo-vertex.svg
      alt: Vertex
      url: ""
    - image: /src/assets/images/component-docs/logo-umbra.svg
      alt: Umbra
      url: ""
  headingPlacement: above
  grayscale: true
  scrolling: false
  maxContentWidth: xl
  paddingHorizontal: gutter
  paddingVertical: 2xl
  colorScheme: inherit
  lockColorScheme: false
  backgroundColor: base
  background:
    type: image
    imageSource: ""
    imageAlt: ""
    positionVertical: top
    positionHorizontal: center
    fixed: false
    priority: false
    mask: none
    overlay: 0
preview:
  text:
    - Logo Cloud
  subtext:
    - key: heading
  image: public/component-previews/page-sections/proof/logo-cloud.svg
  icon: workspaces
  gallery:
    image: public/component-previews/page-sections/proof/logo-cloud.svg
    fit: cover
picker_preview:
  text: Logo Cloud
  subtext: A "trusted by" strip of client logos with an optional muted lead line.
  image: public/component-previews/page-sections/proof/logo-cloud.svg
  gallery:
    image: public/component-previews/page-sections/proof/logo-cloud.svg
    fit: cover
_inputs_from_glob:
  - /src/components/page-sections/proof/logo-cloud/logo-cloud.cloudcannon.inputs.yml
  - /.cloudcannon/inputs/background.yml
  - /.cloudcannon/inputs/haze.yml
_structures:
  logoCloudLogos:
    values:
      - label: Logo
        icon: workspaces
        value:
          image: ""
          alt: Company name
          url: ""
          monochrome: true
          width: 120
          height: 28
        preview:
          text:
            - key: alt
            - Logo
          image:
            - key: image
        _inputs:
          image:
            type: image
            comment: The logo image. Constrained by height, so any aspect ratio works.
            options:
              paths:
                static: ""
                uploads: src/assets/images
          alt:
            type: text
            comment: Accessible name for the logo (the company name).
            options:
              required: true
              required_message: A linked logo with no alt text is a link with no name.
          url:
            type: url
            comment: Optional link to the company's site. Linked logos show a hover affordance — color restore in grayscale, a slight scale in full color.
          monochrome:
            type: switch
            comment: >-
              Draws the mark in the strip's own grey instead of its own colours,
              which is how the design sets this row. It silhouettes the file, so
              leave it off for a logo that needs more than one colour. A mark
              saved in white needs it on, or it is invisible on the cream strip.
          width:
            type: number
            comment: >-
              The width the mark is drawn at, in pixels, measured off the design.
              Marks sit on one line and are capped by height, so this mostly sets
              how the mark reads against its neighbours.
          height:
            type: number
            comment: The matching height in pixels. 28 for most of the row.
groups:
  - heading: Content
    inputs:
      - heading
      - logos
      - grayscale
      - headingPlacement
      - scrolling
  - heading: Section settings
    comment: Width, spacing, color scheme, and background for this section.
    collapsed: true
    inputs:
      - sectionLabel
      - maxContentWidth
      - paddingHorizontal
      - paddingVertical
      - colorScheme
      - lockColorScheme
      - backgroundColor
      - background
      - haze
