layout:
  type: select
  comment: Centred on its own, or split with the customer's mark beside it.
  options:
    values:
      - id: centered
        name: Centered
      - id: split
        name: Split
company:
  type: text
  comment: The customer's name, set as a wordmark in the card. Ignored when a logo is set.
logoSource:
  type: image
  comment: The customer's logo, shown in the card instead of their name.
logoAlt:
  type: text
  comment: Alt text for the logo.
accentColor:
  type: select
  label: Emphasis color
  comment: Colors the emphasised run of the quote.
  options:
    values:
      - id: none
        name: Default
        swatch: check_box_outline_blank
      - id: moss
        name: Moss
        swatch: square
        color: "#687E00"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
      - id: sunset
        name: Sunset
        swatch: square
        color: "#D85A2C"
      - id: golden
        name: Golden
        swatch: square
        color: "#FFAA00"
      - id: peachy
        name: Peachy
        swatch: square
        color: "#F39B7B"
      - id: harbour
        name: Harbour
        swatch: square
        color: "#A6C1FA"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
text:
  type: markdown
  comment: The testimonial quote text.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
authorName:
  type: text
  comment: Name of the testimonial author.
authorDescription:
  type: text
  comment: Title or description of the author (e.g., job title, company).
authorImage:
  type: image
  comment: Photo of the testimonial author.
  options:
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: cover
    width: 480
    height: 480

# --- section wrapper inputs (CustomSection) ---
# Configures the CustomSection wrapper, not this section's own content. Inline
# per component so a project can trim the size/padding lists in place.
# `new:component` slices from this marker down — keep the marker line verbatim.
sectionLabel:
  type: text
  comment: Names the section in the editor and sets its anchor id.
maxContentWidth:
  type: select
  comment: Maximum width of the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingHorizontal:
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: gutter
        name: Page gutter
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingVertical:
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
      - id: 6xl
        name: 6xl
colorScheme:
  hidden: true
  # Carried by the band colour. Every band the design draws names its own ink,
  # and `base` on its own does not say whether you get the cream band or the
  # near-black one — which is why this and the lock had to agree with a third
  # field on every dark section.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  hidden: true
  # Carried by the band colour: every named band locks, because there is no
  # dark mode here for an unlocked one to follow.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name