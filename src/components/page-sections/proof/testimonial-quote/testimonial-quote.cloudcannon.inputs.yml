variant:
  type: select
  label: Layout
  comment: >-
    The four the design draws. Carousel is the only one that shows more than
    the first quote.
  options:
    values:
      - id: static
        name: Static
      - id: carousel
        name: Carousel
      - id: split-person
        name: Split, person left
      - id: split-quote
        name: Split, quote left
quoteSize:
  type: select
  label: Quote size
  comment: >-
    The design steps the quote down a size as it gets longer. Header 5 is the
    smaller of the two.
  options:
    values:
      - id: sm
        name: Header 5
      - id: lg
        name: Header 4
tone:
  type: select
  label: Card tone
  comment: >-
    Dark for a dark band, light for a cream one. Plain draws no card at all,
    which is what the case-study band wants: the quote sits on the band's own
    pattern. The accent colour does not change with it, and the pale accents
    only hold on the dark card.
  options:
    values:
      - id: base
        name: Dark
      - id: light
        name: Light
      - id: plain
        name: No card
cardWidth:
  type: select
  label: Card width
  comment: >-
    How much of the column the card takes. 72% is the house width and the
    default; full runs it to the whole column, narrow is the bento's 55%.
  options:
    values:
      - id: full
        name: Full width
      - id: medium
        name: Medium (72%)
      - id: narrow
        name: Narrow (55%)
bordered:
  type: switch
  label: Outline the card
  comment: >-
    Draws a hairline around the card. Off by default: on a patterned band it
    reads as a box around the quote rather than as the edge of a surface.
quotes:
  type: array
  label: Quotes
  comment: >-
    One quote for every layout but the carousel, which reads them all.
  options:
    structures: _structures.testimonialQuoteItems

# --- section wrapper inputs (CustomSection) ---
# Configures the CustomSection wrapper, not this section's own content. Inline
# per component so a project can trim the size/padding lists in place.
# `new:component` slices from this marker down — keep the marker line verbatim.
sectionLabel:
  type: text
  comment: Names the section in the editor and sets its anchor id.
maxContentWidth:
  type: select
  comment: Maximum width of the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingHorizontal:
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: gutter
        name: Page gutter
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingVertical:
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
      - id: 6xl
        name: 6xl
colorScheme:
  hidden: true
  # Carried by the band colour. Every band the design draws names its own ink,
  # and `base` on its own does not say whether you get the cream band or the
  # near-black one — which is why this and the lock had to agree with a third
  # field on every dark section.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  hidden: true
  # Carried by the band colour: every named band locks, because there is no
  # dark mode here for an unlocked one to follow.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
backgroundColor:
  type: select
  label: Band colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
logoAspect:
  type: text
  comment: >-
    The client mark's own proportions, as `width / height`, for the case-study
    layout. Taken from the SVG's viewBox.
paddingVerticalStart:
  type: select
  comment: >-
    Overrides the padding above the card. Useful where the band above already
    carries its own, and the two stack into a gap neither asked for.
  options:
    values: [none, xs, sm, md, lg, xl, 2xl, 3xl, 4xl, 5xl, 6xl]
paddingVerticalEnd:
  type: select
  comment: Overrides the padding below the card.
  options:
    values: [none, xs, sm, md, lg, xl, 2xl, 3xl, 4xl, 5xl, 6xl]
