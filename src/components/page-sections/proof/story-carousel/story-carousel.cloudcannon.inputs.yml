eyebrow:
  type: text
  comment: Short label above the heading.
heading:
  type: text
  comment: The section's title.
headingLevel:
  type: select
  comment: Heading level for the title. Use h1 once per page, on the first section.
  options:
    values:
      - h1
      - h2
      - h3
headingSize:
  type: select
  comment: Size of the title, independent of its level.
  options:
    values:
      - id: 2xl
        name: Header 1
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
      - id: sm
        name: Header 5
      - id: xs
        name: Header 6
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
  options:
    blockquote: false
    bold: true
    italic: true
    link: true
subtextSize:
  type: select
  comment: Body 3 at 19 or Subtitle 1 at 22 in the design; regular is 16.
  options:
    values:
      - id: md
        name: Regular
      - id: lg
        name: Large
      - id: xl
        name: Extra large
subtextWidth:
  type: select
  label: Subtext width
  comment: >-
    The measure the supporting line is set in, not the column it sits in. The
    design draws a centred one at about Medium in the 1040 column; run to the
    full width it reads as a different block.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow (460)
      - id: md
        name: Medium (580)
      - id: lg
        name: Wide (680)
      - id: xl
        name: Extra wide (820)
stories:
  type: array
  comment: >-
    One card per customer story. Each carries its own accent colour, which the
    figure takes as well, so a row reads as a set rather than a repeat.
buttonSections:
  type: array
  comment: Call-to-action buttons below the row.

# --- section wrapper inputs
sectionLabel:
  type: text
  comment: Accessible name for the section, used by screen readers.
maxContentWidth:
  type: select
  comment: Maximum width of the section's content.
  options:
    values:
      - id: none
        name: None
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
paddingHorizontal:
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: gutter
        name: Page gutter
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
paddingVertical:
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
colorScheme:
  hidden: true
  # Carried by the band colour. Every band the design draws names its own ink,
  # and `base` on its own does not say whether you get the cream band or the
  # near-black one — which is why this and the lock had to agree with a third
  # field on every dark section.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  hidden: true
  # Carried by the band colour: every named band locks, because there is no
  # dark mode here for an unlocked one to follow.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
background:
  type: object
  comment: Background image, video or pattern for the section.

