# The two tabs. A structure value draws its first-level nested keys as tabs
# when it sets `tabbed: true`; `groups` only ever draws as accordions. The
# subtype is pinned so the tabbing stops here — left unsaid these inherit it,
# and then every field inside them has to be an object too.
content:
  type: object
  label: Content
  options:
    subtype: object
style:
  type: object
  label: Style
  comment: What paints the band.
  options:
    subtype: object

content.images:
  type: array
  comment: >-
    The photographs, left to right. They keep their size and the band crops
    them: on a narrow window the middle one stays centred and the outer two
    show as much as there is room for.
  options:
    structures: _structures.photoStripImages
content.imageWidth:
  type: number
  label: Photo width
  comment: How wide each photograph is drawn, in pixels. The design draws 393.
content.aspectRatio:
  type: text
  label: Photo shape
  comment: The shape of each photograph, as a CSS ratio. The design draws 393 / 275.

# --- section wrapper inputs
content.sectionLabel:
  type: text
  comment: Accessible name for the section, used by screen readers.
style.maxContentWidth:
  hidden: true
  # Set from the design, not by an editor.
  type: select
  comment: How wide the band's content runs. Full is the 1040 content column.
  options:
    values:
      - id: xl
        name: Full
      - id: lg
        name: Compact
style.paddingHorizontal:
  hidden: true
  # Set from the design, not by an editor.
  type: select
  comment: The space either side of the content.
  options:
    values:
      - id: gutter
        name: Default page gutter
      - id: none
        name: None
style.paddingVertical:
  hidden: true
  # Set from the design, not by an editor.
  type: select
  comment: The space above and below the content.
  options:
    values:
      - id: 2xl
        name: Default
      - id: md
        name: Compact
style.colorScheme:
  hidden: true
  # Carried by the band colour.
  type: select
  comment: Light or dark scheme for the section.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
style.lockColorScheme:
  hidden: true
  # Carried by the band colour.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle.
style.backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
