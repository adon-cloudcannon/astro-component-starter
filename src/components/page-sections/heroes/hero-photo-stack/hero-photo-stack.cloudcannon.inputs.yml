eyebrow:
  type: text
  comment: Short label above the heading. Optional.
heading:
  type: text
  comment: The hero's title.
headingLevel:
  type: select
  comment: Heading level for the title. A page's hero is usually h1.
  options:
    values:
      - h1
      - h2
      - h3
headingSize:
  type: select
  comment: >-
    Size of the title, independent of its level. The design opens a page on
    Header 1 and a section on Header 2.
  options:
    values:
      - id: 2xl
        name: Header 1
      - id: xl
        name: Header 2
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
subtextSize:
  type: select
  comment: >-
    How big the supporting line under the heading is. Regular is the size the
    design uses on most sections.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large
subtextWidth:
  type: select
  label: Subtext width
  comment: >-
    How wide the supporting line is allowed to run before it wraps. The design
    keeps a centred one around Medium rather than letting it run the full
    width of the section.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide
photos:
  type: array
  comment: >-
    The deck, front photo first. Two is what the design draws: clicking the
    deck sends the front one to the back, so a pair trades places and three or
    more run as a cycle. One photo on its own is drawn as a print and is not
    clickable.
  options:
    structures: _structures.photoStackPhotos
panels:
  type: array
  label: Story columns
  comment: >-
    The two columns under the headline, each painted in its own colour and run
    to its own edge of the page. The first starts higher than the second,
    which is what the design draws.
  options:
    structures: _structures.photoStackPanels
panelRaise:
  type: number
  label: Column stagger
  comment: How far the first column starts above the second, in pixels.
buttonSections:
  type: array
  comment: Buttons under the copy. Optional.
  options:
    structures: _structures.buttonSections
embellishmentSource:
  type: image
  label: Drawing
  comment: >-
    A drawing laid over the deck's bottom corner, like the frond the design
    puts there. Decoration, so it is hidden from screen readers.
embellishmentWidth:
  type: range
  label: Drawing width
  comment: How wide the drawing is drawn, as a percentage of the deck.
  options:
    min: 10
    max: 120
    step: 5
reverse:
  type: switch
  comment: Puts the deck on the left and the copy on the right.

# --- section wrapper inputs
sectionLabel:
  type: text
  comment: Accessible name for the section, used by screen readers.
maxContentWidth:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: Maximum width of the content.
  options:
    values:
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
paddingHorizontal:
  hidden: true
  # Set from the design, not by an editor.
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: gutter
        name: Page gutter
      - id: lg
        name: Large
paddingVertical:
  hidden: true
  # Set from the design, not by an editor.
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
colorScheme:
  hidden: true
  # Carried by the band colour.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  hidden: true
  # Carried by the band colour.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle.
backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
pattern:
  type: select
  label: Texture
  comment: The texture drawn behind the band.
  options:
    values:
      - id: none
        name: None
      - id: grid
        name: Grid
      - id: pegboard
        name: Peg board
haze:
  type: switch
  comment: >-
    Pools the band's own colour behind the heading, which is what keeps the
    copy readable over a texture.
