# The two tabs. A structure value draws its first-level nested keys as tabs
# when it sets `tabbed: true`; `groups` only ever draws as accordions. The
# subtype is pinned so the tabbing stops here — left unsaid these inherit it,
# and then every field inside them has to be an object too.
content:
  type: object
  label: Content
  options:
    subtype: object
style:
  type: object
  label: Style
  comment: What paints the band.
  options:
    subtype: object

content.eyebrow:
  type: text
  comment: Short label above the heading. Optional.
content.heading:
  type: text
  comment: The hero's title.
content.headingLevel:
  type: select
  comment: Heading level for the title. A page's hero is usually h1.
  options:
    values:
      - h1
      - h2
      - h3
content.headingSize:
  type: select
  comment: >-
    Size of the title, independent of its level. The design opens a page on
    Header 1 and a section on Header 2.
  options:
    values:
      - id: 2xl
        name: Header 1
      - id: xl
        name: Header 2
content.subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
content.subtextSize:
  type: select
  comment: >-
    How big the supporting line under the heading is. Regular is the size the
    design uses on most sections.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large
content.subtextWidth:
  type: select
  label: Subtext width
  comment: >-
    How wide the supporting line is allowed to run before it wraps. The design
    keeps a centred one around Medium rather than letting it run the full
    width of the section.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide
content.photos:
  type: array
  comment: >-
    The deck, front photo first. Two is what the design draws: clicking the
    deck sends the front one to the back, so a pair trades places and three or
    more run as a cycle. One photo on its own is drawn as a print and is not
    clickable.
  options:
    structures: _structures.photoStackPhotos
content.panels:
  type: array
  label: Story columns
  comment: >-
    The two columns under the headline, each painted in its own colour and run
    to its own edge of the page. The first starts higher than the second,
    which is what the design draws.
  options:
    structures: _structures.photoStackPanels
content.panelRaise:
  type: number
  label: Column stagger
  comment: How far the first column starts above the second, in pixels.
content.buttonSections:
  type: array
  comment: Buttons under the copy. Optional.
  options:
    structures: _structures.buttonSections
content.embellishmentSource:
  type: image
  label: Drawing
  comment: >-
    A drawing over the deck's bottom corner, like the frond the design puts
    there, or hung off the band itself. Decoration, so it is hidden from
    screen readers.
content.embellishmentWidth:
  type: range
  label: Drawing width
  comment: >-
    How wide the drawing is drawn, as a percentage of whatever it hangs off.
  options:
    min: 10
    max: 120
    step: 5
content.embellishmentPlacement:
  type: select
  label: Drawing placement
  comment: >-
    Deck tucks it under the deck's outer corner. Band hangs it off the band's
    own bottom corner on the copy's side and lets it run off the page, which
    is how the Careers fern is drawn.
  options:
    values:
      - id: deck
        name: On the deck
      - id: band
        name: Off the band
content.reverse:
  type: switch
  comment: Puts the deck on the left and the copy on the right.

# --- section wrapper inputs
content.sectionLabel:
  type: text
  comment: Accessible name for the section, used by screen readers.
style.maxContentWidth:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: How wide the band's content runs. Full is the 1040 content column.
  options:
    values:
      - id: xl
        name: Full
      - id: lg
        name: Compact
style.paddingHorizontal:
  hidden: true
  # Set from the design, not by an editor.
  type: select
  comment: The space either side of the content.
  options:
    values:
      - id: gutter
        name: Default page gutter
      - id: none
        name: None
style.paddingVertical:
  hidden: true
  # Set from the design, not by an editor.
  type: select
  comment: The space above and below the content.
  options:
    values:
      - id: 4xl
        name: Default
      - id: md
        name: Compact
style.colorScheme:
  hidden: true
  # Carried by the band colour.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
style.lockColorScheme:
  hidden: true
  # Carried by the band colour.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle.
style.backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
style.pattern:
  type: select
  label: Texture
  comment: The texture drawn behind the band.
  options:
    values:
      - id: none
        name: None
      - id: grid
        name: Grid
      - id: pegboard
        name: Peg board
style.haze:
  type: switch
  comment: >-
    Pools the band's own colour behind the heading, which is what keeps the
    copy readable over a texture.
