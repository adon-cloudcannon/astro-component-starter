      size: md
  note:
    - text: No credit card
      iconName: check
      iconColor: default
      link:
    - text: 14-day free trial
      iconName: check
      iconColor: default
      link:
  reverse: false
  imageRounded: true
  maxContentWidth: xl
  paddingHorizontal: gutter
  paddingVertical: 4xl
  colorScheme: inherit
  lockColorScheme: false
  backgroundColor: light-sand
  pattern: grid
  haze: true
preview:
  text:
    - Hero Split
  subtext:
    - key: heading
  image: public/component-previews/page-sections/heroes/hero-split.svg
  icon: web_asset
  gallery:
    image: public/component-previews/page-sections/heroes/hero-split.svg
    fit: cover
picker_preview:
  text: Hero Split
  subtext: Prominent section block for landing pages.
  image: public/component-previews/page-sections/heroes/hero-split.svg
  gallery:
    image: public/component-previews/page-sections/heroes/hero-split.svg
    fit: cover
# No background.yml or haze.yml. The hero writes both itself, from `pattern`
# and a switch, and a later glob entry would put the shared definitions back
# over the top of the simpler ones.
_inputs_from_glob:
  - /src/components/page-sections/heroes/hero-split/hero-split.cloudcannon.inputs.yml
groups:
  - heading: Content
    inputs:
      - heading
      - headingSize
      - headingLevel
      - subtext
      - imageSource
      - imageAlt
      - imageAspectRatio
      - imageRounded
      - imageBleed
      - imageOverflow
      - buttonSections
      - note
      - reverse
  - heading: Section settings
    comment: Width, spacing, color scheme, and background for this section.
    collapsed: true
    inputs:
      - sectionLabel
      - backgroundColor
      - pattern
      - haze
