heading:
  type: text
  comment: Main heading for the section.
headingLevel:
  type: select
  comment: Heading level for the title. Use h1 once per page, on the first section.
  options:
    values:
      - h1
      - h2
      - h3
headingSize:
  type: select
  comment: >-
    Size of the title, independent of its level. The design opens the homepage
    on Header 1 and every other page on Header 2.
  options:
    values:
      - id: 2xl
        name: Header 1
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
      - id: sm
        name: Header 5
      - id: xs
        name: Header 6
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
subtextSize:
  hidden: true
  # One size on every hero, so it is the component's decision rather than
  # a field an editor has to get right.
  type: select
  comment: Body 3 at 19 or Subtitle 1 at 22 in the design; regular is 16.
  options:
    values:
      - id: md
        name: Regular
      - id: lg
        name: Large
      - id: xl
        name: Extra large
subtextWidth:
  hidden: true
  # Never set on a hero: the measure is the split's own column.
  type: number
  comment: >-
    Measure for the supporting line, in pixels. The design sets a centred one
    at about 580 rather than the full column. Leave empty for the full width.
imageSource:
  type: image
  comment: Image shown beside the copy.
  options:
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: contain
    width: 1920
    height: 1280
imageAlt:
  type: text
  comment: Alt text describing the image.
imageAspectRatio:
  type: select
  comment: Crops the image to a fixed aspect ratio.
  options:
    values:
      - id: none
        name: None
      - id: square
        name: Square (1:1)
      - id: landscape
        name: Landscape (4:3)
      - id: portrait
        name: Portrait (3:4)
      - id: widescreen
        name: Widescreen (16:9)
imageOverflow:
  type: number
  comment: >-
    How far the image may spill past its column, in pixels, measured from the
    design. Capped at the page edge, so it can never reach further than a full
    bleed. Leave at 0 to keep the image inside its column.
imageBleed:
  type: switch
  comment: Runs the image to the page edge. Landscape or Square aspect ratios work best.
buttonSections:
  type: array
  comment: Call-to-action buttons.
  options:
    structures: _structures.buttonSections
reverse:
  type: switch
  comment: Flips the columns so the image comes before the copy.
imageRounded:
  type: switch
  comment: Rounds the image's corners.
note:
  type: array
  comment: Small print beneath the buttons, such as trial or pricing reassurances.
  options:
    structures: _structures.listItems

# --- section wrapper inputs (CustomSection) ---
# Configures the CustomSection wrapper, not this section's own content. Inline
# per component so a project can trim the size/padding lists in place.
# `new:component` slices from this marker down — keep the marker line verbatim.
sectionLabel:
  type: text
  comment: Names the section in the editor and sets its anchor id.
maxContentWidth:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: Maximum width of the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingHorizontal:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: gutter
        name: Page gutter
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingVertical:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
      - id: 6xl
        name: 6xl
colorScheme:
  hidden: true
  # Carried by the band colour: picking Dark brings its ink with it.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  hidden: true
  # Carried by the band colour: picking Dark brings its ink with it.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
pattern:
  type: select
  label: Texture
  comment: The pattern drawn behind the band. Both are inked from the band's own colours.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: grid
        name: Grid
        swatch: grid_4x4
      - id: pegboard
        name: Peg board
        swatch: blur_linear
    picker_view: card
    preview:
      icon:
        - key: swatch
      text:
        - key: name
haze:
  type: switch
  label: Haze behind the heading
  comment: >-
    Pools the band's own colour behind the copy and blurs it, so the heading
    stays readable where the pattern runs under it. Where it sits and how big
    it is follow the copy column.
backgroundColor:
  type: select
  label: Band colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name

