# The two tabs. CloudCannon draws a structure value's first-level nested keys
# as tabs when it sets `tabbed: true`, and takes the tab's name from the key
# unless the input gives it a label.
#
# `subtype: object` is not decoration. An object input takes `object`, `tabbed`
# or `mutable`, and left unsaid these two were drawing their own children as
# tabs — which means every child has to be an object, and production said so
# once per field: "heading is not an object", and the same for the other
# twenty. Pinned, the tabs stop at this level, where they were asked for.
content:
  type: object
  label: Content
  comment: The copy, the picture, and how the two sit together.
  options:
    subtype: object
style:
  type: object
  label: Style
  comment: What paints the band behind it.
  options:
    subtype: object

content.heading.heading:
  type: text
  comment: Main heading for the section.
content.heading.headingLevel:
  type: select
  comment: Heading level for the title. Use h1 once per page, on the first section.
  options:
    values:
      - h1
      - h2
      - h3
content.heading.headingSize:
  type: select
  # Two, not six. The design opens the homepage on Header 1 and every other
  # page on Header 2, and that is what all thirteen heroes draw. A hero set to
  # Header 5 is a mistake that looks like a choice.
  comment: >-
    Size of the title, independent of its level. The design opens the homepage
    on Header 1 and every other page on Header 2.
  options:
    values:
      - id: 2xl
        name: Header 1
      - id: xl
        name: Header 2
content.subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
content.subtextSize:
  hidden: true
  # One size on every hero, so it is the component's decision rather than
  # a field an editor has to get right.
  type: select
  comment: >-
    How big the supporting line under the heading is. Regular is the size the
    design uses on most sections.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large
content.subtextWidth:
  hidden: true
  # Never set on a hero: the measure is the split's own column.
  type: select
  label: Subtext width
  comment: >-
    How wide the supporting line is allowed to run before it wraps. The design
    keeps a centred one around Medium rather than letting it run the full
    width of the section.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide
content.image.imageSource:
  type: image
  comment: Image shown beside the copy.
  options:
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: contain
    width: 1920
    height: 1280
content.image.imageAlt:
  type: text
  comment: Alt text describing the image.
content.image.imageAspectRatio:
  type: select
  comment: Crops the image to a fixed aspect ratio.
  options:
    values:
      - id: none
        name: None
      - id: square
        name: Square (1:1)
      - id: landscape
        name: Landscape (4:3)
      - id: portrait
        name: Portrait (3:4)
      - id: widescreen
        name: Widescreen (16:9)
content.image.imageOverflow:
  type: number
  comment: >-
    How far the image may spill past its column, in pixels, measured from the
    design. Capped at the page edge, so it can never reach further than a full
    bleed. Leave at 0 to keep the image inside its column.
content.image.imageBleed:
  type: switch
  comment: Runs the image to the page edge. Landscape or Square aspect ratios work best.
content.buttonSections:
  type: array
  comment: Call-to-action buttons.
  options:
    structures: _structures.buttonSections
style.reverse:
  type: switch
  comment: Flips the columns so the image comes before the copy.
content.image.imageRounded:
  type: switch
  comment: Rounds the image's corners.
content.note:
  type: array
  comment: Small print beneath the buttons, such as trial or pricing reassurances.
  options:
    structures: _structures.listItems

# --- section wrapper inputs (CustomSection) ---
# Configures the CustomSection wrapper, not this section's own content. Inline
# per component so a project can trim the size/padding lists in place.
# `new:component` slices from this marker down — keep the marker line verbatim.
# The sub-objects inside the Content tab. An object input nests as deep as the
# data does; `subtype: object` keeps each one a plain group rather than a
# second row of tabs.
content.heading:
  type: object
  label: Heading
  options:
    subtype: object
content.image:
  type: object
  label: Image
  options:
    subtype: object

content.sectionLabel:
  type: text
  comment: Names the section in the editor and sets its anchor id.
content.maxContentWidth:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: Maximum width of the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
content.paddingHorizontal:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: gutter
        name: Page gutter
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
content.paddingVertical:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
      - id: 6xl
        name: 6xl
style.colorScheme:
  hidden: true
  # Carried by the band colour: picking Dark brings its ink with it.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
style.lockColorScheme:
  hidden: true
  # Carried by the band colour: picking Dark brings its ink with it.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
style.pattern:
  type: select
  label: Texture
  comment: The pattern drawn behind the band. Both are inked from the band's own colours.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: grid
        name: Grid
        swatch: grid_4x4
      - id: pegboard
        name: Peg board
        swatch: blur_linear
    picker_view: card
    preview:
      icon:
        - key: swatch
      text:
        - key: name
style.haze:
  type: switch
  label: Haze behind the heading
  comment: >-
    Pools the band's own colour behind the copy and blurs it, so the heading
    stays readable where the pattern runs under it. Where it sits and how big
    it is follow the copy column.
style.backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name

