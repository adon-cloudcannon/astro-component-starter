# The two tabs. A structure value draws its first-level nested keys as tabs
# when it sets `tabbed: true`; `groups` only ever draws as accordions. The
# subtype is pinned so the tabbing stops here — left unsaid these inherit it,
# and then every field inside them has to be an object too.
content:
  type: object
  label: Content
  options:
    subtype: object
style:
  type: object
  label: Style
  comment: What paints the band.
  options:
    subtype: object

content.eyebrow:
  type: text
  comment: The small label above the heading.
content.heading:
  type: text
  comment: The section's heading.
content.headingLevel:
  type: select
  comment: The heading level.
  options:
    values:
      - id: h2
        name: H2
      - id: h3
        name: H3
content.headingSize:
  type: select
  comment: The size of the heading.
  options:
    values:
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
content.subtext:
  type: markdown
  comment: The supporting line under the heading.
content.subtextSize:
  type: select
  comment: How big the supporting line under the heading is.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large
content.subtextWidth:
  type: select
  label: Subtext width
  comment: How wide the supporting line is allowed to run before it wraps.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide
content.alignmentHorizontal:
  type: select
  comment: How the header is aligned.
  options:
    values:
      - id: start
        name: Start
      - id: center
        name: Centre
content.frameLabel:
  type: text
  comment: The address shown in the window's bar. Empty leaves only the dots.
style.frameTone:
  type: select
  comment: How the window is lit.
  options:
    values:
      - id: light
        name: Light
      - id: dark
        name: Dark
content.frameWidth:
  type: number
  comment: >-
    How wide the window is, in pixels. Empty fills the content column, which
    is what lines it up with the rest of the page.
# --- section wrapper inputs (CustomSection) ---
# Configures the CustomSection wrapper, not this section's own content. Inline
# per component so a project can trim the size/padding lists in place.
# `new:component` slices from this marker down — keep the marker line verbatim.
content.sectionLabel:
  type: text
  comment: Names the section in the editor and sets its anchor id.
style.maxContentWidth:
  type: select
  comment: How wide the band's content runs.
  options:
    values:
      - id: xl
        name: Full
      - id: lg
        name: Compact
style.paddingHorizontal:
  type: select
  comment: The space either side of the content.
  options:
    values:
      - id: gutter
        name: Default page gutter
      - id: none
        name: None
style.paddingVertical:
  type: select
  comment: The space above and below the content.
  options:
    values:
      - id: 4xl
        name: Default
      - id: md
        name: Compact
style.colorScheme:
  hidden: true
  # Carried by the band colour. Every band the design draws names its own ink,
  # and `base` on its own does not say whether you get the cream band or the
  # near-black one — which is why this and the lock had to agree with a third
  # field on every dark section.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
style.lockColorScheme:
  hidden: true
  # Carried by the band colour: every named band locks, because there is no
  # dark mode here for an unlocked one to follow.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
style.backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
content.imageSource:
  type: image
  comment: A picture beneath the call to action, running the width of the column.
content.imageAlt:
  type: text
  comment: Alt text for that picture.
