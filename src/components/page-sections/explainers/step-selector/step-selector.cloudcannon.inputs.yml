eyebrow:
  type: text
  comment: Small label above the heading.
heading:
  type: text
  comment: The section's heading.
headingLevel:
  type: select
  options:
    values:
      - h2
      - h3
headingSize:
  type: text
  comment: Heading size slot.
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
subtextSize:
  type: select
  comment: Body 3 at 19 or Subtitle 1 at 22 in the design; regular is 16.
  options:
    values:
      - id: md
        name: Regular
      - id: lg
        name: Large
      - id: xl
        name: Extra large
subtextWidth:
  type: select
  label: Subtext width
  comment: >-
    The measure the supporting line is set in, not the column it sits in. The
    design draws a centred one at about Medium in the 1040 column; run to the
    full width it reads as a different block.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow (460)
      - id: md
        name: Medium (580)
      - id: lg
        name: Wide (680)
      - id: xl
        name: Extra wide (820)
items:
  type: array
  label: Steps
  comment: >-
    One per step. All of them show along the top; the selected one's content
    shows beneath.
  options:
    structures: _structures.contentSelectorItems
