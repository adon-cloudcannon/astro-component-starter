eyebrow:
  type: text
  comment: Small label above the heading.
heading:
  type: text
  comment: The section's heading.
headingLevel:
  type: select
  options:
    values:
      - h2
      - h3
headingSize:
  type: text
  comment: Heading size slot.
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
subtextSize:
  type: select
  comment: >-
    How big the supporting line under the heading is. The design sets Large on
    most sections and Extra large on a few.
  options:
    values:
      - id: md
        name: Regular (16)
      - id: lg
        name: Large (19)
      - id: xl
        name: Extra large (22)
subtextWidth:
  type: select
  label: Subtext width
  comment: >-
    How wide the supporting line is allowed to run before it wraps. The design
    keeps a centred one around Medium rather than letting it run the full
    width of the section.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow (460)
      - id: md
        name: Medium (580)
      - id: lg
        name: Wide (680)
      - id: xl
        name: Extra wide (820)
items:
  type: array
  label: Steps
  comment: >-
    One per step. All of them show along the top; the selected one's content
    shows beneath.
  options:
    structures: _structures.contentSelectorItems
