eyebrow:
  type: text
  comment: Small label above the heading.
heading:
  type: text
  comment: The section's heading.
headingLevel:
  type: select
  options:
    values:
      - h2
      - h3
headingSize:
  type: text
  comment: Heading size slot.
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
subtextSize:
  type: select
  comment: Body 3 at 19 or Subtitle 1 at 22 in the design; regular is 16.
  options:
    values:
      - id: md
        name: Regular
      - id: lg
        name: Large
      - id: xl
        name: Extra large
subtextWidth:
  type: number
  comment: >-
    Measure for the supporting line, in pixels. The design sets a centred one
    at about 580 rather than the full column. Leave empty for the full width.
items:
  type: array
  label: Steps
  comment: >-
    One per step. All of them show along the top; the selected one's content
    shows beneath.
  options:
    structures: _structures.contentSelectorItems
