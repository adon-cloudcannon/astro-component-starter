eyebrow:
  type: text
  comment: Small label above the heading.
heading:
  type: text
  comment: The section's heading.
headingLevel:
  type: select
  options:
    values:
      - h2
      - h3
headingSize:
  type: text
  comment: Heading size slot.
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
subtextSize:
  type: select
  comment: >-
    How big the supporting line under the heading is. Regular is the size the
    design uses on most sections.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large
subtextWidth:
  type: select
  label: Subtext width
  comment: >-
    How wide the supporting line is allowed to run before it wraps. The design
    keeps a centred one around Medium rather than letting it run the full
    width of the section.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide
items:
  type: array
  label: Steps
  comment: >-
    One per step. All of them show along the top; the selected one's content
    shows beneath.
  options:
    structures: _structures.contentSelectorItems
