# The two tabs. A structure value draws its first-level nested keys as tabs
# when it sets `tabbed: true`; `groups` only ever draws as accordions. The
# subtype is pinned so the tabbing stops here — left unsaid these inherit it,
# and then every field inside them has to be an object too.
content:
  type: object
  label: Content
  options:
    subtype: object
style:
  type: object
  label: Style
  comment: What paints the band.
  options:
    subtype: object

content.eyebrow:
  type: text
  comment: Short label above the heading.
content.heading:
  type: text
  comment: Main heading for the section.
content.headingSize:
  type: select
  comment: Size of the title, independent of its level.
  options:
    values:
      - id: 2xl
        name: Header 1
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
      - id: sm
        name: Header 5
      - id: xs
        name: Header 6
content.headingLevel:
  type: select
  comment: Heading level for the title. Use h1 once per page, on the first section.
  options:
    values:
      - h1
      - h2
      - h3
content.subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
content.subtextSize:
  type: select
  comment: How big the supporting line under the heading is.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large
content.subtextWidth:
  type: select
  label: Subtext width
  comment: How wide the supporting line is allowed to run before it wraps.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide
content.steps:
  type: array
  label: Steps
  comment: >-
    One per step. They advance as the page scrolls, the picture beside them
    changing, with a bar showing how far through the reader is.
  options:
    structures: _structures.scrollStepperSteps
content.reverse:
  type: switch
  label: Picture first
  comment: Puts the picture on the start side and the copy on the end side.
content.mediaWidth:
  type: select
  label: Media width
  comment: How much of the row the sticky picture takes on desktop.
  options:
    values:
      - id: half
        name: Half
      - id: wide
        name: Wide
      - id: narrow
        name: Narrow
content.progressStyle:
  type: select
  label: Progress indicator
  comment: A bar or dots below the sticky picture. Hidden on mobile.
  options:
    values:
      - id: bar
        name: Bar
      - id: dots
        name: Dots
      - id: none
        name: None
content.sectionLabel:
  type: text
  comment: Names the section in the editor and sets its anchor id.
style.maxContentWidth:
  type: select
  comment: >-
    How wide the band's content runs. Full is the 1040 content column; compact
    is 768, which still holds a heading beside a row of marks.
  options:
    values:
      - id: xl
        name: Full
      - id: lg
        name: Compact
style.paddingHorizontal:
  type: select
  comment: The space either side of the content.
  options:
    values:
      - id: gutter
        name: Default page gutter
      - id: none
        name: None
style.paddingVertical:
  type: select
  comment: The space above and below the content.
  options:
    values:
      - id: 4xl
        name: Default
      - id: md
        name: Compact
style.colorScheme:
  hidden: true
  # Carried by the band colour. Every band the design draws names its own ink,
  # and `base` on its own does not say whether you get the cream band or the
  # near-black one — which is why this and the lock had to agree with a third
  # field on every dark section.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
style.lockColorScheme:
  hidden: true
  # Carried by the band colour: every named band locks, because there is no
  # dark mode here for an unlocked one to follow.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
style.pattern:
  type: select
  label: Texture
  comment: The pattern drawn behind the band, inked from the band's own colours.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: grid
        name: Grid
        swatch: grid_4x4
      - id: grid-fade
        name: Grid, fading out
        swatch: grid_4x4
      - id: grid-top
        name: Grid, top only
        swatch: grid_4x4
      - id: pegboard
        name: Peg board
        swatch: blur_linear
      - id: pegboard-fade
        name: Peg board, fading out
        swatch: blur_linear
    picker_view: card
    preview:
      icon:
        - key: swatch
      text:
        - key: name
style.haze:
  type: switch
  label: Haze behind the heading
  comment: >-
    Pools the band's own colour behind the copy and blurs it, so the heading
    stays readable where the pattern runs under it.
style.backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
content.alignmentHorizontal:
  type: select
  label: Header alignment
  comment: >-
    Whether the band's own heading is centred over the steps or runs from the
    left. Each step's own heading stays left either way.
  options:
    values:
      - id: start
        name: Left
      - id: center
        name: Centered
