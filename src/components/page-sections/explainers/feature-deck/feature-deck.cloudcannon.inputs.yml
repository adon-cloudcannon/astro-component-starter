eyebrow:
  type: text
  comment: Short label above the heading. Optional.
heading:
  type: text
  comment: The section's title. Optional; the deck can stand on its own.
headingLevel:
  type: select
  comment: Heading level for the title.
  options:
    values:
      - h1
      - h2
      - h3
headingSize:
  type: select
  comment: Size of the title, independent of its level.
  options:
    values:
      - id: 2xl
        name: Header 1
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
subtextSize:
  type: select
  comment: Body 3 at 19 or Subtitle 1 at 22 in the design; regular is 16.
  options:
    values:
      - id: md
        name: Regular
      - id: lg
        name: Large
      - id: xl
        name: Extra large
subtextWidth:
  type: number
  comment: >-
    Measure for the supporting line, in pixels. The design sets a centred one
    at about 580 rather than the full column. Leave empty for the full width.
cards:
  type: array
  comment: >-
    The cards in the deck, in the order they stack. Each holds ordinary content
    blocks, so a card can carry whatever a section can.
stickyOffset:
  type: select
  comment: How far below the top of the screen a card pins.
  options:
    values:
      - id: none
        name: None
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
cardColorScheme:
  type: select
  comment: Colour scheme for the cards, independent of the section.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
showRail:
  type: switch
  comment: Shows the jump links beside the deck.

# --- section wrapper inputs
sectionLabel:
  type: text
  comment: Accessible name for the section, used by screen readers.
maxContentWidth:
  type: select
  comment: Maximum width of the section's content.
  options:
    values:
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
paddingHorizontal:
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: gutter
        name: Page gutter
      - id: lg
        name: Large
paddingVertical:
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
colorScheme:
  type: select
  comment: Colour scheme for this section.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  type: switch
  comment: Keeps this section's scheme when the rest of the page changes.
backgroundColor:
  type: select
  comment: Background color for the section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: muted
        name: Muted
      - id: brand
        name: Brand
background:
  type: object
  comment: Background image, video or pattern for the section.

haze:
  type: switch
  comment: >-
    Pools the section's own background colour behind the content and blurs it,
    so a heading stays readable where an illustration or a pattern runs
    underneath.
