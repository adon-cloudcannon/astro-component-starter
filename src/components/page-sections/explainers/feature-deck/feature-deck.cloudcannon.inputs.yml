# The two tabs. A structure value draws its first-level nested keys as tabs
# when it sets `tabbed: true`; `groups` only ever draws as accordions. The
# subtype is pinned so the tabbing stops here — left unsaid these inherit it,
# and then every field inside them has to be an object too.
content:
  type: object
  label: Content
  options:
    subtype: object
style:
  type: object
  label: Style
  comment: What paints the band.
  options:
    subtype: object

content.eyebrow:
  type: text
  comment: Short label above the heading. Optional.
content.heading:
  type: text
  comment: The section's title. Optional; the deck can stand on its own.
content.headingLevel:
  type: select
  comment: Heading level for the title.
  options:
    values:
      - h1
      - h2
      - h3
content.headingSize:
  type: select
  comment: Size of the title, independent of its level.
  options:
    values:
      - id: 2xl
        name: Header 1
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
content.subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
content.subtextSize:
  type: select
  comment: How big the supporting line under the heading is.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large
content.subtextWidth:
  type: select
  label: Subtext width
  comment: How wide the supporting line is allowed to run before it wraps.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide
content.cards:
  type: array
  comment: >-
    The cards in the deck, in the order they stack. Each holds ordinary content
    blocks, so a card can carry whatever a section can.
content.stickyOffset:
  type: select
  comment: How far below the top of the screen a card pins.
  options:
    values:
      - id: none
        name: None
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
content.cardColorScheme:
  hidden: true
  # The cards are cream on every deck the design draws, and a card that
  # takes its own scheme independently of the band is a way to get a dark
  # card on a dark band and nothing else.
  type: select
  comment: Colour scheme for the cards, independent of the section.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
content.showRail:
  hidden: true
  # The rail is what tells a reader where they are in the stack, so a deck
  # without it is a deck missing a part rather than a variant.
  type: switch
  comment: Shows the jump links beside the deck.

# --- section wrapper inputs
content.sectionLabel:
  type: text
  comment: Accessible name for the section, used by screen readers.
style.maxContentWidth:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: How wide the band's content runs.
  options:
    values:
      - id: xl
        name: Full
      - id: lg
        name: Compact
style.paddingHorizontal:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: The space either side of the content.
  options:
    values:
      - id: gutter
        name: Default page gutter
      - id: none
        name: None
style.paddingVertical:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: The space above and below the content.
  options:
    values:
      - id: 4xl
        name: Default
      - id: md
        name: Compact
style.colorScheme:
  hidden: true
  # Carried by the band colour. Every band the design draws names its own ink,
  # and `base` on its own does not say whether you get the cream band or the
  # near-black one — which is why this and the lock had to agree with a third
  # field on every dark section.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
style.lockColorScheme:
  hidden: true
  # Carried by the band colour: every named band locks, because there is no
  # dark mode here for an unlocked one to follow.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
style.pattern:
  type: select
  label: Texture
  comment: The pattern drawn behind the band, inked from the band's own colours.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: grid
        name: Grid
        swatch: grid_4x4
      - id: pegboard
        name: Peg board
        swatch: blur_linear
    picker_view: card
    preview:
      icon:
        - key: swatch
      text:
        - key: name
style.fade:
  type: select
  label: Texture fade
  comment: Which edge the texture fades out towards. Only applies where there is one.
  options:
    values:
      - id: none
        name: None
      - id: top
        name: Fade out at the top
      - id: bottom
        name: Fade out at the bottom
style.haze:
  type: switch
  label: Haze behind the heading
  comment: >-
    Pools the band's own colour behind the copy and blurs it, so the heading
    stays readable where the pattern runs under it.
style.backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name