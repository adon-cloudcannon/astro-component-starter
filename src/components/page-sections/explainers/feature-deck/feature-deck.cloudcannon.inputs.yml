eyebrow:
  type: text
  comment: Short label above the heading. Optional.
heading:
  type: text
  comment: The section's title. Optional; the deck can stand on its own.
headingLevel:
  type: select
  comment: Heading level for the title.
  options:
    values:
      - h1
      - h2
      - h3
headingSize:
  type: select
  comment: Size of the title, independent of its level.
  options:
    values:
      - id: 2xl
        name: Header 1
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
subtextSize:
  type: select
  comment: Body 3 at 19 or Subtitle 1 at 22 in the design; regular is 16.
  options:
    values:
      - id: md
        name: Regular
      - id: lg
        name: Large
      - id: xl
        name: Extra large
subtextWidth:
  type: select
  label: Subtext width
  comment: >-
    The measure the supporting line is set in, not the column it sits in. The
    design draws a centred one at about Medium in the 1040 column; run to the
    full width it reads as a different block.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow (460)
      - id: md
        name: Medium (580)
      - id: lg
        name: Wide (680)
      - id: xl
        name: Extra wide (820)
cards:
  type: array
  comment: >-
    The cards in the deck, in the order they stack. Each holds ordinary content
    blocks, so a card can carry whatever a section can.
stickyOffset:
  type: select
  comment: How far below the top of the screen a card pins.
  options:
    values:
      - id: none
        name: None
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
cardColorScheme:
  hidden: true
  # The cards are cream on every deck the design draws, and a card that
  # takes its own scheme independently of the band is a way to get a dark
  # card on a dark band and nothing else.
  type: select
  comment: Colour scheme for the cards, independent of the section.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
showRail:
  hidden: true
  # The rail is what tells a reader where they are in the stack, so a deck
  # without it is a deck missing a part rather than a variant.
  type: switch
  comment: Shows the jump links beside the deck.

# --- section wrapper inputs
sectionLabel:
  type: text
  comment: Accessible name for the section, used by screen readers.
maxContentWidth:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: Maximum width of the section's content.
  options:
    values:
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
paddingHorizontal:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: gutter
        name: Page gutter
      - id: lg
        name: Large
paddingVertical:
  hidden: true
  # Set from the design, not by an editor: every band on the site uses the
  # same column and the same rhythm, and a section that drifts from it reads
  # as a mistake rather than a choice.
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
colorScheme:
  hidden: true
  # Carried by the band colour. Every band the design draws names its own ink,
  # and `base` on its own does not say whether you get the cream band or the
  # near-black one — which is why this and the lock had to agree with a third
  # field on every dark section.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  hidden: true
  # Carried by the band colour: every named band locks, because there is no
  # dark mode here for an unlocked one to follow.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
background:
  type: object
  comment: Background image, video or pattern for the section.

