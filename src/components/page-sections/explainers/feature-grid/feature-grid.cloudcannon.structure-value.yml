label: Feature Grid
icon: apps
description: Grid of features with icons and short descriptions.
value:
  _component: page-sections/explainers/feature-grid
  eyebrow: What you get
  heading: Three things worth knowing
  headingLevel: h2
  subtext: One line that frames the points below.
  subtextSize: md
  subtextWidth: ""
  alignmentHorizontal: center
  columns: 3
  features:
    - title: Fast
      description: Static HTML and CSS, so a page renders before any JavaScript runs.
      iconName: zap
      iconColor: golden
      iconBackground: true
    - title: Brandable
      description: Color, type, and spacing come from one token file you set once.
      iconName: swatch-book665-book
      iconColor: pacific
      iconBackground: true
    - title: Editable
      description: Anyone on the team can update a page without opening the code.
      iconName: square-pen
      iconColor: moss
      iconBackground: true
  sectionLabel: ""
  maxContentWidth: xl
  paddingHorizontal: gutter
  paddingVertical: 4xl
  backgroundColor: light-sand
  background:
    type: image
    imageSource: ""
    imageAlt: ""
    positionVertical: top
    positionHorizontal: center
    fixed: false
    priority: false
    mask: none
    overlay: 0
preview:
  text:
    - Feature Grid
  subtext:
    - key: heading
  image: public/component-previews/page-sections/explainers/feature-grid.svg
  icon: apps
  gallery:
    image: public/component-previews/page-sections/explainers/feature-grid.svg
    fit: cover
picker_preview:
  text: Feature Grid
  subtext: Grid of feature highlights with icons and descriptions.
  image: public/component-previews/page-sections/explainers/feature-grid.svg
  gallery:
    image: public/component-previews/page-sections/explainers/feature-grid.svg
    fit: cover
_inputs_from_glob:
  - /src/components/page-sections/explainers/feature-grid/feature-grid.cloudcannon.inputs.yml
  - /.cloudcannon/inputs/background.yml
  - /.cloudcannon/inputs/haze.yml
_structures:
  featureGridItems:
    values:
      - label: Feature
        icon: apps
        value:
          title: Feature title
          description: Feature description placeholder text that will be replaced with actual content.
          iconName: zap
          iconColor: golden
          iconBackground: true
        preview:
          text:
            - key: title
            - Feature
          subtext:
            - key: description
          image:
            - template: src/icons/{iconName}.svg
        _inputs:
          eyebrow:
            type: text
            comment: >-
              Short label above the title. Setting one turns the card into a signpost: bigger title,
              a rule under the art, and a link out.
          title:
            type: text
            comment: Name of the feature.
          description:
            type: markdown
            comment: Supporting description for the feature.
            options:
              blockquote: false
              bold: true
              format: null
              italic: true
              link: true
              strike: false
              subscript: true
              superscript: true
              underline: false
              bulletedlist: false
              numberedlist: false
          iconName:
            type: select
            comment: Icon displayed with the feature. Sourced from [Heroicons](https://heroicons.com/).
            options:
              values: data.icons
              preview:
                text:
                  - key: name
                image:
                  - template: src/icons/{id}.svg
          iconColor:
            type: select
            comment: Color accent applied to the icon.
            options:
              values:
                - id: default
                  name: Default
                  swatch: check_box_outline_blank
                - id: pacific
                  name: Pacific
                  swatch: square
                  color: "#034AD8"
                - id: moss
                  name: Moss
                  swatch: square
                  color: "#687E00"
                - id: golden
                  name: Golden
                  swatch: square
                  color: "#FFAA00"
                - id: peachy
                  name: Peachy
                  swatch: square
                  color: "#F39B7B"
                - id: sunset
                  name: Sunset
                  swatch: square
                  color: "#D85A2C"
                - id: kiwi
                  name: Kiwi
                  swatch: square
                  color: "#7C3442"
                - id: blush
                  name: Blush
                  swatch: square
                  color: "#E7B0B9"
                - id: harbour
                  name: Harbour
                  swatch: square
                  color: "#A6C1FA"
              picker_view: card
              preview:
                icon:
                  - key: swatch
                icon_color:
                  - key: color
                text:
                  - key: name
          iconBackground:
            type: switch
            comment: Draw a plate behind the icon.
          iconSolid:
            type: switch
            comment: >-
              Fill that plate with the colour itself rather than tinting it, and round it to a
              disc. The glyph is knocked out in whatever reads on the colour. This is the shape
              Careers draws; everywhere else uses the tint.
          divider:
            type: switch
            comment: >-
              A hairline between the card's head and its line. Careers draws one on all nine of its
              benefit cards; nothing else does.
          accentColor:
            type: select
            comment: Colour of the card's rule. The design gives each card its own.
            options:
              values:
                - id: none
                  name: None
                  swatch: check_box_outline_blank
                - id: pacific
                  name: Pacific
                  swatch: square
                  color: "#034AD8"
                - id: moss
                  name: Moss
                  swatch: square
                  color: "#687E00"
                - id: golden
                  name: Golden
                  swatch: square
                  color: "#FFAA00"
                - id: peachy
                  name: Peachy
                  swatch: square
                  color: "#F39B7B"
                - id: sunset
                  name: Sunset
                  swatch: square
                  color: "#D85A2C"
                - id: harbour
                  name: Harbour
                  swatch: square
                  color: "#A6C1FA"
              picker_view: card
              preview:
                icon:
                  - key: swatch
                icon_color:
                  - key: color
                text:
                  - key: name
          imageSource:
            type: image
            comment: A drawing above the title, in place of the icon.
          imageAlt:
            type: text
            comment: Alternative text for the drawing.
          imageHeight:
            type: number
            comment: >-
              How tall to draw the illustration, in pixels. The design gives each one its own box.
              Leave empty for the default.
          linkText:
            type: text
            comment: Label for the link out of the card. Leave empty for no link.
          link:
            type: url
            comment: Where the card's link goes.
