label: Feature Grid
icon: apps
description: Grid of features with icons and short descriptions.
value:
  _component: page-sections/explainers/feature-grid
  sectionLabel: ""
  eyebrow: What you get
  heading: Three things worth knowing
  headingLevel: h2
  subtext: One line that frames the points below.
  subtextSize: md
  alignmentHorizontal: center
  columns: 3
  features:
    - title: Fast
      description: Static HTML and CSS, so a page renders before any JavaScript runs.
      iconName: bolt
      iconColor: golden
      iconBackground: true
    - title: Brandable
      description: Color, type, and spacing come from one token file you set once.
      iconName: swatch
      iconColor: pacific
      iconBackground: true
    - title: Editable
      description: Anyone on the team can update a page without opening the code.
      iconName: pencil-square
      iconColor: moss
      iconBackground: true
  maxContentWidth: xl
  paddingHorizontal: gutter
  paddingVertical: 4xl
  colorScheme: inherit
  lockColorScheme: false
  backgroundColor: base
  background:
    type: image
    imageSource: ""
    imageAlt: ""
    positionVertical: top
    positionHorizontal: center
    fixed: false
    priority: false
    mask: none
    overlay: 0
preview:
  text:
    - Feature Grid
  subtext:
    - key: heading
  image: public/component-previews/page-sections/explainers/feature-grid.svg
  icon: apps
  gallery:
    image: public/component-previews/page-sections/explainers/feature-grid.svg
    fit: cover
picker_preview:
  text: Feature Grid
  subtext: Grid of feature highlights with icons and descriptions.
  image: public/component-previews/page-sections/explainers/feature-grid.svg
  gallery:
    image: public/component-previews/page-sections/explainers/feature-grid.svg
    fit: cover
_inputs_from_glob:
  - /src/components/page-sections/explainers/feature-grid/feature-grid.cloudcannon.inputs.yml
  - /.cloudcannon/inputs/background.yml
  - /.cloudcannon/inputs/haze.yml
_structures:
  featureGridItems:
    values:
      - label: Feature
        icon: apps
        value:
          title: Feature title
          description: Feature description placeholder text that will be replaced with actual content.
          iconName: bolt
          iconColor: golden
          iconBackground: true
        preview:
          text:
            - key: title
            - Feature
          subtext:
            - key: description
          image:
            - template: src/icons/{iconName}.svg
        _inputs:
          eyebrow:
            type: text
            comment: >-
              Short label above the title. Setting one turns the card into a
              signpost: bigger title, a rule under the art, and a link out.
          title:
            type: text
            comment: Name of the feature.
          description:
            type: markdown
            comment: Supporting description for the feature.
            options:
              blockquote: false
              bold: true
              format:
              italic: true
              link: true
              strike: false
              subscript: true
              superscript: true
              underline: false
              bulletedlist: false
              numberedlist: false
          iconName:
            type: select
            comment: Icon displayed with the feature. Sourced from [Heroicons](https://heroicons.com/).
            options:
              values: data.icons
              preview:
                text:
                  - key: name
                image:
                  - template: src/icons/{id}.svg
          iconColor:
            type: select
            comment: Color accent applied to the icon.
            options:
              values:
                - id: default
                  name: Default
                  preview:
                    icon: check_box_outline_blank
                - id: pacific
                  name: Pacific
                  preview:
                    icon: square
                    icon_color: "#034AD8"
                - id: moss
                  name: Moss
                  preview:
                    icon: square
                    icon_color: "#687E00"
                - id: golden
                  name: Golden
                  preview:
                    icon: square
                    icon_color: "#FFAA00"
                - id: peachy
                  name: Peachy
                  preview:
                    icon: square
                    icon_color: "#F39B7B"
                - id: sunset
                  name: Sunset
                  preview:
                    icon: square
                    icon_color: "#D85A2C"
                - id: kiwi
                  name: Kiwi
                  preview:
                    icon: square
                    icon_color: "#7C3442"
                - id: blush
                  name: Blush
                  preview:
                    icon: square
                    icon_color: "#E7B0B9"
                - id: harbour
                  name: Harbour
                  preview:
                    icon: square
                    icon_color: "#A6C1FA"
          iconBackground:
            type: switch
            comment: Draw a tinted plate behind the icon.
          accentColor:
            type: select
            comment: Colour of the card's rule. The design gives each card its own.
            options:
              values:
                - id: none
                  name: None
                  preview:
                    icon: check_box_outline_blank
                - id: pacific
                  name: Pacific
                  preview:
                    icon: square
                    icon_color: "#034AD8"
                - id: moss
                  name: Moss
                  preview:
                    icon: square
                    icon_color: "#687E00"
                - id: golden
                  name: Golden
                  preview:
                    icon: square
                    icon_color: "#FFAA00"
                - id: peachy
                  name: Peachy
                  preview:
                    icon: square
                    icon_color: "#F39B7B"
                - id: sunset
                  name: Sunset
                  preview:
                    icon: square
                    icon_color: "#D85A2C"
                - id: harbour
                  name: Harbour
                  preview:
                    icon: square
                    icon_color: "#A6C1FA"
          imageSource:
            type: image
            comment: A drawing above the title, in place of the icon.
          imageAlt:
            type: text
            comment: Alternative text for the drawing.
          imageHeight:
            type: number
            comment: >-
              How tall to draw the illustration, in pixels. The design gives each one its own
              box. Leave empty for the default.
          linkText:
            type: text
            comment: Label for the link out of the card. Leave empty for no link.
          link:
            type: url
            comment: Where the card's link goes.
groups:
  - heading: Content
    inputs:
      - eyebrow
      - heading
      - subtext
      - subtextSize
      - subtextWidth
      - alignmentHorizontal
      - columns
      - features
  - heading: Section settings
    comment: Width, spacing, color scheme, and background for this section.
    collapsed: true
    inputs:
      - sectionLabel
      - headingLevel
      - maxContentWidth
      - paddingHorizontal
      - paddingVertical
      - colorScheme
      - lockColorScheme
      - backgroundColor
      - background
      - haze
