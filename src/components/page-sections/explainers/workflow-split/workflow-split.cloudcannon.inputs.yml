# The two tabs. A structure value draws its first-level nested keys as tabs
# when it sets `tabbed: true`; `groups` only ever draws as accordions. The
# subtype is pinned so the tabbing stops here — left unsaid these inherit it,
# and then every field inside them has to be an object too.
content:
  type: object
  label: Content
  options:
    subtype: object
style:
  type: object
  label: Style
  comment: What paints the band.
  options:
    subtype: object

content.heading.eyebrow:
  type: text
  comment: Short label above the heading.
content.heading.heading:
  type: text
  comment: The section's title.
content.heading.headingLevel:
  type: select
  comment: Heading level for the title.
  options:
    values:
      - h1
      - h2
      - h3
content.heading.headingSize:
  type: select
  comment: Size of the title, independent of its level.
  options:
    values:
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
content.subtext.subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
content.subtext.subtextSize:
  type: select
  comment: How big the supporting line under the heading is.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large
content.subtext.subtextWidth:
  type: select
  label: Subtext width
  comment: How wide the supporting line is allowed to run before it wraps.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide
content.buttonSections:
  type: array
  comment: A link or button under the heading.
  options:
    structures: _structures.buttonSections
# One object per column. An array asked an editor which index was which and
# answered nothing; named, each column's fields sit under its own heading.
content.leftPanel:
  type: object
  label: Left panel
  options:
    subtype: object
content.rightPanel:
  type: object
  label: Right panel
  options:
    subtype: object
content.middlePanel:
  type: object
  label: Middle panel
  comment: The common ground both columns land in.
  options:
    subtype: object

content.leftPanel.accentColor:
  type: select
  label: Card colour
  comment: >-
    The colour this column is read by: it tints the card, colours the ticks in
    the list and draws the line running into the middle.
  options:
    values:
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
      - id: sunset
        name: Sunset
        swatch: square
        color: "#D85A2C"
      - id: moss
        name: Moss
        swatch: square
        color: "#687E00"
      - id: golden
        name: Golden
        swatch: square
        color: "#FFAA00"
      - id: harbour
        name: Harbour
        swatch: square
        color: "#A6C1FA"
      - id: blush
        name: Blush
        swatch: square
        color: "#E7B0B9"
      - id: kiwi
        name: Kiwi
        swatch: square
        color: "#7C3442"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
content.leftPanel.eyebrow:
  type: text
  comment: The small label above this column's title.
content.leftPanel.heading:
  type: text
  comment: This column's title.
content.leftPanel.image:
  type: object
  label: Image
  options:
    subtype: object
content.leftPanel.image.imageSource:
  type: image
  comment: The drawing that sits above the card.
content.leftPanel.image.imageAlt:
  type: text
  comment: Alt text for the drawing.
content.leftPanel.image.imageOverlap:
  type: number
  comment: How far the drawing dips into the card below it, in pixels.
content.leftPanel.items:
  type: array
  comment: What someone working this way does.
  options:
    structures: _structures.listItems
content.leftPanel.buttonSections:
  type: array
  comment: Where this column goes next. One text link is the usual.
  options:
    structures: _structures.buttonSections

content.rightPanel.accentColor:
  type: select
  label: Card colour
  comment: >-
    The colour this column is read by: it tints the card, colours the ticks in
    the list and draws the line running into the middle.
  options:
    values:
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
      - id: sunset
        name: Sunset
        swatch: square
        color: "#D85A2C"
      - id: moss
        name: Moss
        swatch: square
        color: "#687E00"
      - id: golden
        name: Golden
        swatch: square
        color: "#FFAA00"
      - id: harbour
        name: Harbour
        swatch: square
        color: "#A6C1FA"
      - id: blush
        name: Blush
        swatch: square
        color: "#E7B0B9"
      - id: kiwi
        name: Kiwi
        swatch: square
        color: "#7C3442"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
content.rightPanel.eyebrow:
  type: text
  comment: The small label above this column's title.
content.rightPanel.heading:
  type: text
  comment: This column's title.
content.rightPanel.image:
  type: object
  label: Image
  options:
    subtype: object
content.rightPanel.image.imageSource:
  type: image
  comment: The drawing that sits above the card.
content.rightPanel.image.imageAlt:
  type: text
  comment: Alt text for the drawing.
content.rightPanel.image.imageOverlap:
  type: number
  comment: How far the drawing dips into the card below it, in pixels.
content.rightPanel.items:
  type: array
  comment: What someone working this way does.
  options:
    structures: _structures.listItems
content.rightPanel.buttonSections:
  type: array
  comment: Where this column goes next. One text link is the usual.
  options:
    structures: _structures.buttonSections

content.middlePanel.iconName:
  type: select
  label: Repo mark
  comment: The icon in the card's title bar.
  options:
    values: data.icons
    preview:
      text:
        - key: iconName
      image:
        - template: src/icons/{iconName}.svg
content.middlePanel.title:
  type: text
  label: Repo name
  comment: The name beside the mark, in the card's title bar.
content.middlePanel.showBranch:
  type: switch
  label: Show the branch
  comment: Closes the title bar with a status light and the branch name.
content.middlePanel.cardColor:
  type: select
  label: Card colour
  comment: Which way the card is painted. Everything inside it follows.
  options:
    values:
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: light
        name: Sand
        swatch: square
        color: "#FBF6E9"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
content.middlePanel.centreRows:
  type: array
  comment: The commit rows down the card.
content.middlePanel.centreRows[*]:
  type: object
  options:
    subtype: object
content.middlePanel.centreRows[*].kind:
  type: select
  comment: Which panel this commit came from. It colours the row's dot and label.
  options:
    values:
      - id: left
        name: Left panel
      - id: right
        name: Right panel
content.middlePanel.centreRows[*].author:
  type: text
  comment: The label after the dot.
content.middlePanel.centreRows[*].message:
  type: text
  comment: The commit message.
content.middlePanel.centreRows[*].hash:
  type: text
  comment: The short hash at the end of the row.
# --- section wrapper inputs
# The heading's level and size belong with the heading, the way the hero's do.
content.subtext:
  type: object
  label: Subtext
  options:
    subtype: object
content.heading:
  type: object
  label: Heading
  options:
    subtype: object

content.sectionLabel:
  type: text
  comment: Accessible name for the section, used by screen readers.
style.colorScheme:
  hidden: true
  # Carried by the band colour. Every band the design draws names its own ink,
  # and `base` on its own does not say whether you get the cream band or the
  # near-black one — which is why this and the lock had to agree with a third
  # field on every dark section.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
style.lockColorScheme:
  hidden: true
  # Carried by the band colour: every named band locks, because there is no
  # dark mode here for an unlocked one to follow.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
style.pattern:
  type: select
  label: Texture
  comment: The pattern drawn behind the band, inked from the band's own colours.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: grid
        name: Grid
        swatch: grid_4x4
      - id: pegboard
        name: Peg board
        swatch: blur_linear
    picker_view: card
    preview:
      icon:
        - key: swatch
      text:
        - key: name
style.fade:
  type: select
  label: Texture fade
  comment: Which edge the texture fades out towards. Only applies where there is one.
  options:
    values:
      - id: none
        name: None
      - id: top
        name: Fade out at the top
      - id: bottom
        name: Fade out at the bottom
style.haze:
  type: switch
  label: Haze behind the heading
  comment: >-
    Pools the band's own colour behind the copy and blurs it, so the heading
    stays readable where the pattern runs under it.
style.backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
# The middle panel's chrome: set from the mapping, hidden from the editor.
# It is furniture rather than copy — the icon, the title and the branch light
# are the panel's own title bar, the way a Git client's is — so there is
# nothing here an editor would want to reach for. Declared rather than
# hardcoded so the words stay out of the component and sit in the mapping with
# everything else the design sets.
