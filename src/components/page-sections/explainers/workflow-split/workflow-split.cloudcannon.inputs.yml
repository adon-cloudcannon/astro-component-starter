# The two tabs. A structure value draws its first-level nested keys as tabs
# when it sets `tabbed: true`; `groups` only ever draws as accordions. The
# subtype is pinned so the tabbing stops here — left unsaid these inherit it,
# and then every field inside them has to be an object too.
content:
  type: object
  label: Content
  options:
    subtype: object
style:
  type: object
  label: Style
  comment: What paints the band.
  options:
    subtype: object

content.eyebrow:
  type: text
  comment: Short label above the heading.
content.heading:
  type: text
  comment: The section's title.
content.headingLevel:
  type: select
  comment: Heading level for the title.
  options:
    values:
      - h1
      - h2
      - h3
content.headingSize:
  type: select
  comment: Size of the title, independent of its level.
  options:
    values:
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
content.subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
content.subtextSize:
  type: select
  comment: >-
    How big the supporting line under the heading is. Regular is the size the
    design uses on most sections.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large
content.subtextWidth:
  type: select
  label: Subtext width
  comment: >-
    How wide the supporting line is allowed to run before it wraps. The design
    keeps a centred one around Medium rather than letting it run the full
    width of the section.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide
content.buttonSections:
  type: array
  comment: A link or button under the heading.
content.panels:
  type: array
  comment: >-
    One panel per way of working, side by side. Each carries its own accent
    colour, which colours its list markers, its rule and its link, so a reader
    can tell the columns apart before reading them. A panel's imageOverlap is
    how far its drawing dips into the card below it, in pixels.
content.centreImageSource:
  type: image
  comment: The thing both panels share, shown between them.
content.centreImageAlt:
  type: text
  comment: Alt text for the middle image.

# --- section wrapper inputs
content.sectionLabel:
  type: text
  comment: Accessible name for the section, used by screen readers.
content.maxContentWidth:
  type: select
  comment: Maximum width of the section's content.
  options:
    values:
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
content.paddingHorizontal:
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: gutter
        name: Page gutter
      - id: lg
        name: Large
content.paddingVertical:
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
style.colorScheme:
  hidden: true
  # Carried by the band colour. Every band the design draws names its own ink,
  # and `base` on its own does not say whether you get the cream band or the
  # near-black one — which is why this and the lock had to agree with a third
  # field on every dark section.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
style.lockColorScheme:
  hidden: true
  # Carried by the band colour: every named band locks, because there is no
  # dark mode here for an unlocked one to follow.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
style.backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
style.background:
  type: object
  comment: Background image, video or pattern for the section.

content.centreColor:
  type: color
  label: Middle panel colour
  comment: >-
    Draws the middle of the row as a panel of its own rather than a picture.
    The design uses #26262F, which is not in the palette: the nearest token,
    --gray-900, is a different colour by about 12.

content.centreMinHeight:
  type: number
  label: Middle panel height
  comment: >-
    The least it can be, in pixels. It shares the bottom edge of the pair
    either side and grows upward, so the design's 366 against their 321 is what
    makes it stand a little proud of them.

content.centreSections:
  type: array
  label: Middle panel content
  comment: What goes inside the middle panel.
  options:
    structures: _structures.scrollStepperSections

# The middle panel's chrome: set from the mapping, hidden from the editor.
# It is furniture rather than copy — the icon, the title and the branch light
# are the panel's own title bar, the way a Git client's is — so there is
# nothing here an editor would want to reach for. Declared rather than
# hardcoded so the words stay out of the component and sit in the mapping with
# everything else the design sets.
content.centreIconName:
  type: select
  hidden: true
  label: Middle panel icon
  comment: The mark at the head of the middle panel.
  options:
    values: data.icons

content.centreTitle:
  type: text
  hidden: true
  label: Middle panel title
  comment: The line beside that icon, set in 14/700 white.

content.centreBranch:
  type: text
  hidden: true
  label: Middle panel branch
  comment: >-
    Closes the header row with a status light and the branch name, set in the
    mono face at 10.5 the way a Git client shows it.

content.centreRows:
  type: array
  hidden: true
  label: Middle panel rows
  comment: The commit rows down the panel. Chrome, like the header above them.
