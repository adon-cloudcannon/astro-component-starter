eyebrow:
  type: text
  comment: Short label above the heading.
heading:
  type: text
  comment: The section's title.
headingLevel:
  type: select
  comment: Heading level for the title.
  options:
    values:
      - h1
      - h2
      - h3
headingSize:
  type: select
  comment: Size of the title, independent of its level.
  options:
    values:
      - id: xl
        name: Header 2
      - id: lg
        name: Header 3
      - id: md
        name: Header 4
subtext:
  type: markdown
  comment: Supporting copy beneath the heading.
subtextSize:
  type: select
  comment: Body 3 at 19 or Subtitle 1 at 22 in the design; regular is 16.
  options:
    values:
      - id: md
        name: Regular
      - id: lg
        name: Large
      - id: xl
        name: Extra large
subtextWidth:
  type: number
  comment: >-
    Measure for the supporting line, in pixels. The design sets a centred one
    at about 580 rather than the full column. Leave empty for the full width.
buttonSections:
  type: array
  comment: A link or button under the heading.
panels:
  type: array
  comment: >-
    One panel per way of working, side by side. Each carries its own accent
    colour, which colours its list markers, its rule and its link, so a reader
    can tell the columns apart before reading them. A panel's imageOverlap is
    how far its drawing dips into the card below it, in pixels.
centreImageSource:
  type: image
  comment: The thing both panels share, shown between them.
centreImageAlt:
  type: text
  comment: Alt text for the middle image.

# --- section wrapper inputs
sectionLabel:
  type: text
  comment: Accessible name for the section, used by screen readers.
maxContentWidth:
  type: select
  comment: Maximum width of the section's content.
  options:
    values:
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
paddingHorizontal:
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: none
        name: None
      - id: gutter
        name: Page gutter
      - id: lg
        name: Large
paddingVertical:
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
colorScheme:
  type: select
  comment: Colour scheme for this section.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  type: switch
  comment: Keeps this section's scheme when the rest of the page changes.
backgroundColor:
  type: select
  comment: Background color for the section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: muted
        name: Muted
background:
  type: object
  comment: Background image, video or pattern for the section.

centreColor:
  type: color
  label: Middle panel colour
  comment: >-
    Draws the middle of the row as a panel of its own rather than a picture.
    The design uses #26262F, which is not in the palette: the nearest token,
    --gray-900, is a different colour by about 12.

centreMinHeight:
  type: number
  label: Middle panel height
  comment: >-
    The least it can be, in pixels. It shares the bottom edge of the pair
    either side and grows upward, so the design's 366 against their 321 is what
    makes it stand a little proud of them.

centreSections:
  type: array
  label: Middle panel content
  comment: What goes inside the middle panel.
  options:
    structures: _structures.scrollStepperSections

centreIconName:
  type: select
  label: Middle panel icon
  comment: The mark at the head of the middle panel.
  options:
    values: data.icons

centreTitle:
  type: text
  label: Middle panel title
  comment: The line beside that icon, set in 14/700 white.
