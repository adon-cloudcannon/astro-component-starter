# The two tabs. A structure value draws its first-level nested keys as tabs
# when it sets `tabbed: true`; `groups` only ever draws as accordions. The
# subtype is pinned so the tabbing stops here — left unsaid these inherit it,
# and then every field inside them has to be an object too.
content:
  type: object
  label: Content
  options:
    subtype: object
style:
  type: object
  label: Style
  comment: What paints the band.
  options:
    subtype: object

content.eyebrow:
  type: text
  comment: Small label above the heading.

content.heading:
  type: text
  comment: The band's own heading, above the steps. Each step keeps its own.

content.headingLevel:
  type: select
  comment: Heading rank in the page outline. Pick by position, not by size.
  options:
    values:
      - id: h2
        name: H2
      - id: h3
        name: H3
      - id: h4
        name: H4

content.headingSize:
  type: select
  comment: Visual size, independent of the rank above.
  options:
    values:
      - id: xl
        name: Extra large
      - id: lg
        name: Large
      - id: md
        name: Medium
      - id: sm
        name: Small

content.subtext:
  type: markdown
  comment: Supporting line under the heading.

content.subtextSize:
  type: select
  comment: >-
    How big the supporting line under the heading is. Regular is the size the
    design uses on most sections.
  options:
    values:
      - id: md
        name: Small
      - id: lg
        name: Regular
      - id: xl
        name: Large

content.subtextWidth:
  type: select
  label: Subtext width
  comment: >-
    How wide the supporting line is allowed to run before it wraps. The design
    keeps a centred one around Medium rather than letting it run the full
    width of the section.
  options:
    values:
      - id: ""
        name: Full width
      - id: sm
        name: Narrow
      - id: md
        name: Medium
      - id: lg
        name: Wide
      - id: xl
        name: Extra wide

content.alignmentHorizontal:
  type: select
  label: Header alignment
  comment: >-
    Whether the band's own header is centred over the steps or runs from the
    left. Each step's own copy stays left either way.
  options:
    values:
      - id: start
        name: Left
      - id: center
        name: Centered

content.steps:
  type: array
  comment: >-
    One per state of the band. The band holds still for a screen of scroll per
    step while the copy and the picture beside it change.
  options:
    structures:
      values:
        - label: Step
          icon: layers
          value:
            contentSections: []
            mediaSections: []
          preview:
            icon: layers
            text:
              - Step
          _inputs:
            contentSections:
              type: array
              label: Copy
              comment: The words for this step. Usually a heading, a line and a link.
              options:
                structures: _structures.scrollStepperSections
            mediaSections:
              type: array
              label: Picture
              comment: >-
                What shows beside the copy for this step. Safe to leave empty:
                the band holds its shape and steps either way.
              options:
                structures: _structures.scrollStepperSections

content.reverse:
  type: switch
  comment: Put the picture on the left and the copy on the right.

content.mediaWidth:
  type: select
  comment: How much of the band the picture takes.
  options:
    values:
      - id: half
        name: Half
      - id: wide
        name: Wide
      - id: narrow
        name: Narrow

content.showProgress:
  type: switch
  label: Progress bar
  comment: >-
    A bar along the foot of the band, one segment per step, filling as you
    advance. Hidden below the tablet breakpoint, where every step is shown at
    once.

# The band-level inputs, same set and same wording as every other page
# section carries, so this one is configured the way the rest are.
content.sectionLabel:
  type: text
  comment: Names the section in the editor and sets its anchor id.
style.maxContentWidth:
  type: select
  comment: How wide the band's content runs. Full is the 1040 content column.
  options:
    values:
      - id: xl
        name: Full
      - id: md
        name: Compact
style.paddingHorizontal:
  type: select
  comment: The space either side of the content.
  options:
    values:
      - id: gutter
        name: Default page gutter
      - id: none
        name: None
style.paddingVertical:
  type: select
  comment: The space above and below the content.
  options:
    values:
      - id: 4xl
        name: Default
      - id: md
        name: Compact
style.colorScheme:
  hidden: true
  # Carried by the band colour. Every band the design draws names its own ink,
  # and `base` on its own does not say whether you get the cream band or the
  # near-black one — which is why this and the lock had to agree with a third
  # field on every dark section.
  type: select
  comment: Light or dark scheme for the section. Inherit follows the page.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
style.lockColorScheme:
  hidden: true
  # Carried by the band colour: every named band locks, because there is no
  # dark mode here for an unlocked one to follow.
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
style.backgroundColor:
  type: select
  label: Background colour
  comment: The colour this band is painted, and the ink that goes with it.
  options:
    values:
      - id: none
        name: None
        swatch: check_box_outline_blank
      - id: light-sand
        name: Light sand
        swatch: square
        color: "#FFFCF3"
      - id: sand
        name: Sand
        swatch: square
        color: "#FBF6E9"
      - id: dark-sand
        name: Dark sand
        swatch: square
        color: "#EBE1C9"
      - id: dark
        name: Dark
        swatch: square
        color: "#1D1B17"
      - id: pacific
        name: Pacific
        swatch: square
        color: "#034AD8"
    picker_view: card
    preview:
      icon:
        - key: swatch
      icon_color:
        - key: color
      text:
        - key: name
content.progressColor:
  type: text
  comment: The palette colour the progress fill is drawn in, e.g. sunset, pacific-300.
content.copyColor:
  type: text
  comment: >-
    A palette colour painted behind the copy half of the band, from the page's
    edge to the middle, top to bottom. Empty leaves the copy on the band's own
    colour.
content.stepScroll:
  type: number
  comment: >-
    Screens of scrolling each step holds for. Higher is slower, and the band
    is pinned for all of it, so high values read as the page not responding.
    1.1 is the default.
content.number:
  type: text
  comment: >-
    A step number shown above the copy. Decorative — it is hidden from screen
    readers, which have the step's own label already.
content.progressTrackColor:
  type: text
  comment: >-
    The colour behind the progress fill, as a palette name or a hex. The design
    picks one per band rather than tinting the fill. Leave empty for the fill
    at 22%.
content.numbered:
  type: switch
  comment: >-
    Numbers the steps from their place in the list, drawn in the design's ring:
    a 77px circle with a 1px rule and the figure in the mono face. Leave off to
    set each step's number by hand.
