label: Steps Section
icon: format_list_numbered
description: Numbered how-it-works sequence with optional images.
tabbed: true
value:
  _component: page-sections/explainers/steps-section
  content:
    sectionLabel: ""
    heading:
      eyebrow: How it works
      heading: From order to doorstep
      headingLevel: h2
    subtext: ""
    items:
      - image: ""
        imageAlt: ""
        contentSections:
          - _component: building-blocks/core-elements/heading
            text: Place your order
            level: h3
            size: xs
          - _component: building-blocks/core-elements/simple-text
            text: Choose a size, add it to the cart, and check out in a couple of minutes.
            size: sm
      - image: ""
        imageAlt: ""
        contentSections:
          - _component: building-blocks/core-elements/heading
            text: We pack and ship
            level: h3
            size: xs
          - _component: building-blocks/core-elements/simple-text
            text: Orders placed before 2pm leave the warehouse the same day.
            size: sm
      - image: ""
        imageAlt: ""
        contentSections:
          - _component: building-blocks/core-elements/heading
            text: Track delivery
            level: h3
            size: xs
          - _component: building-blocks/core-elements/simple-text
            text: A tracking link arrives by email as soon as the parcel is scanned.
            size: sm
    orientation: horizontal
    imageAspectRatio: landscape
  style:
    backgroundColor: light-sand
    pattern: none
    fade: none
    maxContentWidth: xl
    paddingHorizontal: gutter
    paddingVertical: 4xl
    haze: false
preview:
  text:
    - Steps Section
  subtext:
    - key: content.heading.heading
  image: public/component-previews/page-sections/explainers/steps-section.svg
  icon: format_list_numbered
picker_preview:
  text: Steps Section
  subtext: A numbered "how it works" sequence with connected step markers.
  image: public/component-previews/page-sections/explainers/steps-section.svg
_inputs_from_glob:
  - /src/components/page-sections/explainers/steps-section/steps-section.cloudcannon.inputs.yml
_structures:
  explainerStepsItems:
    values:
      - label: Step
        icon: format_list_numbered
        value:
          image: ""
          imageAlt: ""
          contentSections:
            - _component: building-blocks/core-elements/heading
              text: Step heading
              level: h3
              size: xs
            - _component: building-blocks/core-elements/simple-text
              text: What happens in this step.
              size: sm
        preview:
          text:
            - key: contentSections.0.text
            - Step
          subtext:
            - key: contentSections.1.text
          image:
            - key: image
        _inputs:
          image:
            type: image
            comment: Optional product or process photo. Every step shares the section's image aspect ratio.
            options:
              paths:
                static: ""
                uploads: src/assets/images
          imageAlt:
            type: text
            comment: Accessible description of the step image.
          contentSections:
            type: array
            label: Step content
            comment: Building blocks for this step — typically a heading and a short description.
            options:
              structures: _structures.stepsItemSections
        _structures_from_glob:
          - /.cloudcannon/structures/stepsItemSections.cloudcannon.structures.yml
