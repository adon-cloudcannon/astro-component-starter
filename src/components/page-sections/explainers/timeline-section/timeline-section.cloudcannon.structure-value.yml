label: Timeline Section
icon: timeline
description: Dated timeline for a company story, funding history, or what comes next.
tabbed: true
value:
  _component: page-sections/explainers/timeline-section
  content:
    sectionLabel: ''
    heading:
      eyebrow: Our story
      heading: How we got here
      headingLevel: h2
    subtext: ''
    subtextSize: md
    subtextWidth: ''
    layout: vertical
    entries:
      - date: '2019'
        title: Founded
        body: Opened the studio and shipped the first client project.
      - date: '2022'
        title: First hires
        body: The team grew to eight and moved into a permanent office.
      - date: '2025'
        title: New markets
        body: Took on the first clients outside the country.
  style:
    backgroundColor: light-sand
    pattern: none
    fade: none
    maxContentWidth: xl
    paddingHorizontal: gutter
    paddingVertical: 4xl
    haze: false
preview:
  text:
    - Timeline Section
  subtext:
    - key: content.heading
  image: public/component-previews/page-sections/explainers/timeline-section.svg
  icon: timeline
picker_preview:
  text: Timeline Section
  subtext: A dated sequence on a rail. Vertical, split, or horizontal.
  image: public/component-previews/page-sections/explainers/timeline-section.svg
_inputs_from_glob:
  - /src/components/page-sections/explainers/timeline-section/timeline-section.cloudcannon.inputs.yml
_structures:
  explainerTimelineEntries:
    values:
      - label: Entry
        icon: timeline
        value:
          year: ''
          date: '2024'
          title: Entry title
          body: ''
          iconName: ''
          accentColor: ''
        preview:
          text:
            - key: title
            - Entry
          subtext:
            - key: date
        _inputs:
          year:
            type: text
            comment: Optional. Set the same year on consecutive entries to group them (month goes in Date).
          date:
            type: text
            comment: >-
              The date shown beside the rail — a year (`2019`), a quarter (`Q3 2026`), or a month
              when Year is set.
          title:
            type: text
            comment: What happened.
          body:
            type: textarea
            comment: Optional supporting copy. Title-only entries are valid.
          accentColor:
            type: select
            label: Marker color
            comment: Fills the marker in Split and Rail layouts. Leave blank for the section's own color.
            options:
              values:
                - id: ''
                  name: Default
                  swatch: check_box_outline_blank
                - id: moss
                  name: Moss
                  swatch: square
                  color: '#687E00'
                - id: pacific
                  name: Pacific
                  swatch: square
                  color: '#034AD8'
                - id: sunset
                  name: Sunset
                  swatch: square
                  color: '#D85A2C'
                - id: golden
                  name: Golden
                  swatch: square
                  color: '#FFAA00'
                - id: peachy
                  name: Peachy
                  swatch: square
                  color: '#F39B7B'
                - id: harbour
                  name: Harbour
                  swatch: square
                  color: '#A6C1FA'
              picker_view: card
              preview:
                icon:
                  - key: swatch
                icon_color:
                  - key: color
                text:
                  - key: name
          iconName:
            type: select
            label: Marker icon
            comment: Optional icon shown in Split and Rail layouts. Leave blank for a dot.
            options:
              values: data.icons
              preview:
                text:
                  - key: iconName
                image:
                  - template: src/icons/{iconName}.svg
