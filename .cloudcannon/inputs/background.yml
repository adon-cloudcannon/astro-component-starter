# Shared by every page section with a background via a second _inputs_from_glob entry.
# Each structure value lists exactly the keys its type reads: `remove_extra_inputs`
# drops any other key when an editor switches `type`.
style.background:
  type: object
  comment: An image, video, or tiled pattern behind the content.
  options:
    preview:
      icon: wallpaper
      text:
        - Background
      subtext:
        - key: type
    structures:
      id_key: type
      reorder_inputs: true
      remove_extra_inputs: true
      values:
        - label: Image
          icon: image
          value:
            type: image
            imageSource: ""
            imageAlt: ""
            positionVertical: top
            positionHorizontal: center
            fixed: false
            priority: false
            mask: none
            overlay: 0
        - label: Video
          icon: videocam
          value:
            type: video
            videoSource: ""
            positionVertical: top
            positionHorizontal: center
            mask: none
            overlay: 0
        - label: Pattern
          icon: texture
          value:
            type: pattern
            pattern: grid
            fixed: false
            mask: none
            overlay: 0
style.background.type:
  type: select
  label: Background type
  comment: A cover image, a muted autoplay video, or a repeating tiled pattern.
  options:
    values:
      - id: image
        name: Image
      - id: video
        name: Video
      - id: pattern
        name: Pattern
style.background.positionVertical:
  comment: Vertical focal point.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
style.background.positionHorizontal:
  comment: Horizontal focal point.
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
style.background.fixed:
  type: switch
  label: Hold the background still
  comment: >-
    Keeps the background where it is while the page scrolls past it, clipped to
    the band. On an image that reads as parallax; on a colour or a pattern it is
    the band holding still while its own content moves through it.
style.background.priority:
  type: switch
  label: Prioritize image load
  comment: Loads the image eagerly. Use near the top of the page.
style.background.imageSource:
  comment: URL or path to the background or pattern image.
  type: image
  options:
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: contain
    width: 1920
    height: 1280
style.background.patternSize:
  type: select
  label: Pattern tile size
  comment: Size of each repeated tile. Natural uses the image's own size.
  options:
    values:
      - id: natural
        name: Natural
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
style.background.imageAlt:
  comment: Alt text for the background image.
  type: textarea
style.background.videoSource:
  type: file
  label: Video source
  comment: Video file in public/videos. Same-named files in other formats are added too.
  options:
    accepts_mime_types:
      - video/mp4
      - video/webm
      - video/ogg
    paths:
      uploads: public/videos
      static: public
style.background.overlay:
  type: range
  comment: Tints the background. -1 darkens, 1 lightens.
  options:
    min: -1
    max: 1
    step: 0.1
style.background.mask:
  type: select
  label: Background fade
  comment: Which part of the background fades into the background color.
  options:
    values:
      - id: none
        name: No fade
      - id: frame
        name: Fade the middle
      - id: vignette
        name: Fade the edges
      - id: top
        name: Fade the top
      - id: bottom
        name: Fade the bottom
      - id: fade
        name: Fade the bottom, softly
      - id: left
        name: Fade the left
      - id: right
        name: Fade the right
      - id: blend
        name: Fade top and bottom

style.background.pattern:
  type: select
  label: Pattern
  comment: >-
    Drawn rather than loaded, and inked from the band's own colours: a grid
    rule is a tint of the background, the peg board is Golden. Both work on any
    background colour, light or dark, without a second file.
  options:
    values:
      - id: grid
        name: Grid
      - id: pegboard
        name: Peg board
