# imageCarouselImages, lifted out of image-carousel.cloudcannon.structure-value.yml.
#
# Must live here. `_structures_from_glob` in cloudcannon.config.yml only picks
# up this folder, so a `_structures` block written inside a component's
# structure-value file reaches nothing: the array that referenced it resolved
# to `values: []`, no item matched a structure, and every field in the item
# fell back to CloudCannon guessing a type from its key. That is why a card's
# Title Size drew a text box and its Icon Color a hex picker.
imageCarouselImages:
  values:
    - label: Image
      icon: image
      value:
        source: ""
        alt: ""
        positionVertical: center
        positionHorizontal: center
      preview:
        image:
          - key: source
        text:
          - key: alt
          - Image
        subtext:
          - key: source
      _inputs:
        source:
          type: image
          comment: Image source.
          options:
            paths:
              uploads: src/assets/images
              static: ""
            resize_style: contain
            width: 1920
            height: 1280
        alt:
          type: text
          comment: Alt text describing the image.
        positionVertical:
          type: select
          comment: Vertical positioning of the image within the frame.
          options:
            values:
              - id: top
                name: Top
              - id: center
                name: Center
              - id: bottom
                name: Bottom
        positionHorizontal:
          type: select
          comment: Horizontal positioning of the image within the frame.
          options:
            values:
              - id: left
                name: Left
              - id: center
                name: Center
              - id: right
                name: Right
