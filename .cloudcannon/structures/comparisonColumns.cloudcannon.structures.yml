# comparisonColumns, lifted out of comparison-table.cloudcannon.structure-value.yml.
#
# Must live here. `_structures_from_glob` in cloudcannon.config.yml only picks
# up this folder, so a `_structures` block written inside a component's
# structure-value file reaches nothing: the array that referenced it resolved
# to `values: []`, no item matched a structure, and every field in the item
# fell back to CloudCannon guessing a type from its key. That is why a card's
# Title Size drew a text box and its Icon Color a hex picker.
comparisonColumns:
  values:
    - label: Plan
      icon: sell
      value:
        name: ""
        price: ""
        annualPrice: ""
        highlight: false
        buttonText: ""
        buttonLink: ""
      preview:
        text:
          - key: name
          - Plan
        subtext:
          - key: price
        icon: sell
      _inputs:
        name:
          type: text
          comment: The plan's name, shown as the column header.
        price:
          type: text
          label: Line
          comment: >-
            The line under the column's name — a price on a pricing table
            ("$49/mo", "Custom"), a description on a comparison. Leave empty
            to hide. The key is `price` because that is what it was built
            for; what it holds is whatever belongs under the name.
        annualPrice:
          type: text
          comment: >-
            The same line at the yearly rate. Set both and the figure slides between them as the
            billing switch is thrown; leave this empty and the price never changes.
        highlight:
          type: switch
          comment: >-
            Marks this plan as the recommended one, giving its call-to-action the primary button
            style.
        buttonText:
          type: text
          comment: Call to action under the column. Leave empty for no button.
        buttonLink:
          type: url
          comment: Where the button goes.
comparisonRows:
  values:
    - label: Feature row
      icon: check_circle
      value:
        feature: ""
        values:
          - ""
      preview:
        text:
          - key: feature
          - Feature row
        subtext:
          - key: values
        icon: check_circle
      _inputs:
        feature:
          type: text
          comment: The feature being compared, shown in the first column.
        values:
          type: array
          comment: >-
            One value per plan, in the same order as the plans. Missing values render as an empty
            cell.
        values[*]:
          type: text
          comment: Enter "yes" or "no" for a tick or a dash, or any text (e.g. "5 seats") to show as-is.
