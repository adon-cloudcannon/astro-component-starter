# explainerStepsItems, lifted out of steps-section.cloudcannon.structure-value.yml.
#
# Must live here. `_structures_from_glob` in cloudcannon.config.yml only picks
# up this folder, so a `_structures` block written inside a component's
# structure-value file reaches nothing: the array that referenced it resolved
# to `values: []`, no item matched a structure, and every field in the item
# fell back to CloudCannon guessing a type from its key. That is why a card's
# Title Size drew a text box and its Icon Color a hex picker.
explainerStepsItems:
  values:
    - label: Step
      icon: format_list_numbered
      value:
        image: ""
        imageAlt: ""
        contentSections:
          - _component: building-blocks/core-elements/heading
            text: Step heading
            level: h3
            size: xs
          - _component: building-blocks/core-elements/simple-text
            text: What happens in this step.
            size: sm
      preview:
        text:
          - key: contentSections.0.text
          - Step
        subtext:
          - key: contentSections.1.text
        image:
          - key: image
      _inputs:
        image:
          type: image
          comment: Optional product or process photo. Every step shares the section's image aspect ratio.
          options:
            paths:
              static: ""
              uploads: src/assets/images
        imageAlt:
          type: text
          comment: Accessible description of the step image.
        contentSections:
          type: array
          label: Step content
          comment: Building blocks for this step — typically a heading and a short description.
          options:
            structures: _structures.stepsItemSections
      _structures_from_glob:
        - /.cloudcannon/structures/stepsItemSections.cloudcannon.structures.yml
