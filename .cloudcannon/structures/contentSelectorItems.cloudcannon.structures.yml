# A selectable item, shared by content-selector and the step-selector section.
#
# Must live here, not inside a component's structure-value file. A `_structures`
# block there only reaches the component it sits in, so a section that wraps this
# one referenced the name and resolved to nothing, and CloudCannon guessed the
# fields from the values instead.

contentSelectorItems:
  values:
    - label: Content Selector Item
      icon: place_item
      value:
        title: Section Title
        subtext: ""
        iconName: ""
        iconColor: default
        contentSections: []
      preview:
        text:
          - key: title
          - Content Selector Item
        subtext:
          - template: A content selector item containing {contentSections|array_length} content {"block"|pluralize=contentSections}
          - Add content to the content selector item
      _inputs:
        title:
          type: text
          comment: The heading for the content panel.
        subtext:
          type: text
          comment: Optional supporting text shown beneath the item heading.
        iconName:
          comment: The name of the icon to display. Sourced from [Heroicons](https://heroicons.com/).
          type: select
          options:
            values: data.icons
        iconColor:
          type: select
          comment: The color of the icon.
          hidden: "!iconName"
          options:
            values:
              - id: default
                name: Default
              - id: pacific
                name: Pacific
              - id: moss
                name: Moss
              - id: golden
                name: Golden
              - id: peachy
                name: Peachy
              - id: sunset
                name: Sunset
              - id: kiwi
                name: Kiwi
              - id: blush
                name: Blush
              - id: harbour
                name: Harbour
        contentSections:
          type: array
          options:
            structures: _structures.contentSelectorSections
