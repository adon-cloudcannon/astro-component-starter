# testimonialQuoteItems, lifted out of testimonial-quote.cloudcannon.structure-value.yml.
#
# Must live here. `_structures_from_glob` in cloudcannon.config.yml only picks
# up this folder, so a `_structures` block written inside a component's
# structure-value file reaches nothing: the array that referenced it resolved
# to `values: []`, no item matched a structure, and every field in the item
# fell back to CloudCannon guessing a type from its key. That is why a card's
# Title Size drew a text box and its Icon Color a hex picker.
testimonialQuoteItems:
  values:
    - label: Quote
      icon: format_quote
      value:
        text: ""
        authorName: ""
        authorDescription: ""
        company: ""
        authorImage: ""
        authorImageAlt: ""
        logoSource: ""
        logoAlt: ""
        linkText: ""
        link: ""
        accentColor: ""
        quoteMarks: true
      preview:
        text:
          - key: authorName
          - Quote
        subtext:
          - key: text
        icon: format_quote
      _inputs:
        text:
          type: markdown
          comment: >-
            The quote itself. Bold picks words out in the card's accent colour, which is how the
            design highlights a result.
        authorName:
          type: text
          comment: Who said it.
        authorDescription:
          type: text
          comment: Their role. Leave the company to its own field so it can be emphasised.
        company:
          type: text
          comment: Shown after the role, in the card's brighter ink.
        authorImage:
          type: image
          comment: Their headshot. The circle is drawn either way.
          options:
            paths:
              static: ""
              uploads: src/assets/images
        authorImageAlt:
          type: text
          comment: Alt text for the headshot. Leave empty to treat it as decorative.
        logoSource:
          type: image
          comment: The customer's wordmark, shown at the end of the foot. Static layout only.
          options:
            paths:
              static: ""
              uploads: src/assets/images
        logoAlt:
          type: text
          comment: Alt text for the wordmark.
        linkText:
          type: text
          comment: Label for the link under the person, e.g. "Read case study".
        link:
          type: url
          comment: Where that link goes.
        quoteMarks:
          type: switch
          comment: >-
            Wraps the quote in the card's colour. Turn off for a figure rather than something
            somebody said.
        accentColor:
          type: select
          comment: >-
            The card's colour. It does three jobs at once: the emphasised words in the quote take
            it, the quote marks are drawn in it, and the link turns to it on hover.
          options:
            values:
              - id: ""
                name: None
                swatch: check_box_outline_blank
              - id: sunset
                name: Sunset
                swatch: square
                color: "#D85A2C"
              - id: golden
                name: Golden
                swatch: square
                color: "#FFAA00"
              - id: pacific
                name: Pacific
                swatch: square
                color: "#034AD8"
              - id: moss
                name: Moss
                swatch: square
                color: "#687E00"
              - id: peachy
                name: Peachy
                swatch: square
                color: "#F39B7B"
              - id: harbour
                name: Harbour
                swatch: square
                color: "#A6C1FA"
              - id: blush
                name: Blush
                swatch: square
                color: "#E7B0B9"
            picker_view: card
            preview:
              icon:
                - key: swatch
              icon_color:
                - key: color
              text:
                - key: name
