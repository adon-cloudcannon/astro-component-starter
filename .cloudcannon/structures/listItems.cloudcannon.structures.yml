# List item structures, shared by every component that renders a List.
#
# Must live here, not inside a component's structure-value file. A `_structures`
# block there only reaches the component it sits in, so the hero's `note` array
# referenced `_structures.listItems` and resolved to nothing. CloudCannon then
# guessed its fields from the values: a free-text box for `iconName` and, from
# the key's name alone, a hex colour picker for `iconColor`.
listItems:
  values:
    - label: List Item
      value:
        text: "List item"
        iconName: check
        iconColor: default
        link:
      preview:
        icon: text_fields
        image:
          - template: src/icons/{iconName}.svg
      _inputs:
        link:
          type: url
          comment: Optional URL. When set, only the text is linked; the icon stays outside the anchor (e.g. table of contents or external services).
        text:
          type: markdown
          comment: The text to display in the list item.
          options:
            blockquote: false
            bold: true
            format:
            italic: true
            link: true
            strike: false
            subscript: true
            superscript: true
            underline: false
            bulletedlist: false
            numberedlist: false
            removeformat: true
        iconName:
          type: select
          comment: Icon lists only. The name of the icon to display. Sourced from [Heroicons](https://heroicons.com/).
          options:
            values: data.icons
            preview:
              text:
                - key: name
              image:
                - template: src/icons/{id}.svg
        iconColor:
          type: select
          comment: The color of the icon.
          hidden: "!iconName"
          options:
            values:
              - id: default
                name: Default
                swatch: check_box_outline_blank
              - id: pacific
                name: Pacific
                swatch: square
                color: "#034AD8"
              - id: moss
                name: Moss
                swatch: square
                color: "#687E00"
              - id: golden
                name: Golden
                swatch: square
                color: "#FFAA00"
              - id: peachy
                name: Peachy
                swatch: square
                color: "#F39B7B"
              - id: sunset
                name: Sunset
                swatch: square
                color: "#D85A2C"
              - id: kiwi
                name: Kiwi
                swatch: square
                color: "#7C3442"
              - id: blush
                name: Blush
                swatch: square
                color: "#E7B0B9"
              - id: harbour
                name: Harbour
                swatch: square
                color: "#A6C1FA"
            picker_view: card
            preview:
              icon:
                - key: swatch
              icon_color:
                - key: color
              text:
                - key: name
