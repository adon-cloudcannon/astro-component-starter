# cardGridItems, lifted out of card-grid.cloudcannon.structure-value.yml.
#
# Must live here. `_structures_from_glob` in cloudcannon.config.yml only picks
# up this folder, so a `_structures` block written inside a component's
# structure-value file reaches nothing: the array that referenced it resolved
# to `values: []`, no item matched a structure, and every field in the item
# fell back to CloudCannon guessing a type from its key. That is why a card's
# Title Size drew a text box and its Icon Color a hex picker.
cardGridItems:
  values:
    - label: Card
      icon: article
      value:
        image: ""
        imageAlt: ""
        link: ""
        contentSections: []
      preview:
        text:
          - key: contentSections.1.text
          - key: contentSections.0.text
          - Card
        subtext:
          - key: contentSections.2.text
          - Add one or more content blocks
        image:
          - key: image
        icon: article
      _inputs:
        image:
          type: image
          comment: Cover image for the card. Leave empty for a text-only card.
          options:
            paths:
              static: ""
              uploads: src/assets/images
        imageAlt:
          type: text
          comment: >-
            Accessible description of the cover image. Falls back to the first heading in the
            card.
        link:
          type: url
          comment: >-
            Where the card goes. A stretched hit area covers the tile; links inside the content (a
            category badge) stay their own targets. Leave empty for a static card.
        contentSections:
          type: array
          label: Card content
          comment: >-
            Building blocks for this card — typically a badge, heading, and short description. Add
            a date, author, or anything else the card needs.
          options:
            structures: _structures.cardSections
      _structures_from_glob:
        - /.cloudcannon/structures/cardSections.cloudcannon.structures.yml
