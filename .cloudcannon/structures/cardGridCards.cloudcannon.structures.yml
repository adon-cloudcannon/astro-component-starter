# One card in a Card Grid: an icon, a title and a line.
#
# Not shared with featureGridItems on purpose. That one carries an
# illustration, an eyebrow and a link out, because feature-grid draws card
# shapes that have them. This one draws none of those, and a single structure
# holding the union of both is what put an image picker on a careers perk.
cardGridCards:
  values:
    - label: Card
      icon: apps
      value:
        title: Card title
        description: A line about this point, a sentence or two long.
        iconName: zap
        iconBackground: true
        iconSolid: true
        titleSize: auto
        descriptionSize: auto
        divider: true
        alignmentHorizontal: start
        accentColor: golden
      preview:
        text:
          - key: title
          - Card
        subtext:
          - key: description
        image:
          - template: src/icons/{iconName}.svg
      _inputs:
        title:
          type: text
          comment: The card's title.
        titleSize:
          type: select
          comment: >-
            The card's title size. Left on Automatic it takes the size this
            card's shape draws.
          options:
            values:
              - id: auto
                name: Automatic
              - id: xl
                name: Header 2
              - id: lg
                name: Header 3
              - id: md
                name: Header 4
              - id: sm
                name: Header 5
              - id: xs
                name: Header 6
        description:
          type: markdown
          comment: The line under the title.
          options:
            blockquote: false
            bold: true
            format: null
            italic: true
            link: true
            strike: false
            subscript: true
            superscript: true
            underline: false
            bulletedlist: false
            numberedlist: false
        descriptionSize:
          type: select
          comment: >-
            This card's line size. Left on Automatic it follows the size set
            for the whole grid.
          options:
            values:
              - id: auto
                name: Automatic
              - id: sm
                name: Small
              - id: md
                name: Medium
              - id: lg
                name: Large
              - id: xl
                name: Extra Large
        iconName:
          type: select
          comment: The card's icon. Sourced from [Lucide](https://lucide.dev/icons/).
          options:
            values: data.icons
            preview:
              text:
                - key: name
              image:
                - template: src/icons/{id}.svg
        iconBackground:
          # Hidden rather than removed: the key stays in the value so an item
          # still matches this structure, and the component no longer reads it.
          # A card has two looks, not four, and that is the switch below.
          hidden: true
          type: switch
        iconSolid:
          type: switch
          hidden: "!iconName"
          comment: >-
            Draw the icon on a filled disc rather than as a coloured glyph on
            its own. The glyph is knocked out in whatever reads on the colour.
        accentColor:
          type: select
          comment: The card's colour, drawn on its rule and on its icon.
          options:
            values:
              - id: none
                name: None
                swatch: check_box_outline_blank
              - id: pacific
                name: Pacific
                swatch: square
                color: "#034AD8"
              - id: moss
                name: Moss
                swatch: square
                color: "#687E00"
              - id: golden
                name: Golden
                swatch: square
                color: "#FFAA00"
              - id: peachy
                name: Peachy
                swatch: square
                color: "#F39B7B"
              - id: sunset
                name: Sunset
                swatch: square
                color: "#D85A2C"
              - id: harbour
                name: Harbour
                swatch: square
                color: "#A6C1FA"
            picker_view: card
            preview:
              icon:
                - key: swatch
              icon_color:
                - key: color
              text:
                - key: name
        divider:
          type: switch
          comment: A hairline between the card's head and its line.
        alignmentHorizontal:
          type: select
          comment: Which way the card sets its copy.
          options:
            values:
              - id: start
                name: Start
              - id: center
                name: Center
