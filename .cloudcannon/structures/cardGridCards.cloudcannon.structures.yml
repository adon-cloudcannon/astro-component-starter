# One card in a Card Grid: an icon, a title and a line.
#
# Not shared with featureGridItems on purpose. That one carries an
# illustration, an eyebrow and a link out, because feature-grid draws card
# shapes that have them. This one draws none of those, and a single structure
# holding the union of both is what put an image picker on a careers perk.
cardGridCards:
  values:
    - label: Card
      icon: apps
      tabbed: true
      value:
        # `tabbed: true` draws these two as the card's own tabs, nested inside
        # the block's. Within a tab the order here is the order the editor
        # draws: `reorder_inputs` defaults to true, which sorts a block's keys
        # as the structure's first and anything else after.
        #
        # A size sits with the text it sizes rather than with the band's
        # chrome, which is where the section keeps its own. On a card the two
        # are one decision: you pick the words and how big they are together.
        content:
          heading:
            heading: Card title
            headingSize: auto
          subtext:
            subtext: A line about this point, a sentence or two long.
            subtextSize: auto
          iconName: zap
          linkText: ""
          link: ""
        style:
          accentColor: golden
          iconPanel: false
          panelColor: harbour
          panelImage: ""
          panelImageColor: color-text-strong
          iconSolid: true
          divider: true
          alignmentHorizontal: start
          iconBackground: true
      preview:
        text:
          - key: content.heading.heading
          - Card
        subtext:
          - key: content.subtext.subtext
        image:
          - template: src/icons/{content.iconName}.svg
      _inputs:
        content.heading:
          type: object
          label: Heading
          options:
            subtype: object
        content.subtext:
          type: object
          label: Description
          options:
            subtype: object
        content.heading.heading:
          type: text
          comment: The card's heading.
        content.heading.headingSize:
          type: select
          comment: >-
            The heading's size. Left on Automatic it takes the size this
            card's shape draws.
          options:
            values:
              - id: auto
                name: Automatic
              - id: xl
                name: Header 2
              - id: lg
                name: Header 3
              - id: md
                name: Header 4
              - id: sm
                name: Header 5
              - id: xs
                name: Header 6
        content.subtext.subtext:
          type: markdown
          comment: The line under the heading.
          options:
            blockquote: false
            bold: true
            format: null
            italic: true
            link: true
            strike: false
            subscript: true
            superscript: true
            underline: false
            bulletedlist: false
            numberedlist: false
        content.subtext.subtextSize:
          type: select
          comment: >-
            This card's line size. Left on Automatic it follows the size set
            for the whole grid.
          options:
            values:
              - id: auto
                name: Automatic
              - id: sm
                name: Small
              - id: md
                name: Medium
              - id: lg
                name: Large
              - id: xl
                name: Extra Large
        content.linkText:
          type: text
          comment: Label for the link out of the card. Leave empty for no link.
        content.link:
          type: url
          comment: Where the link goes.
          hidden: "!content.linkText"
        content.iconName:
          type: select
          comment: The card's icon. Sourced from [Lucide](https://lucide.dev/icons/).
          options:
            values: data.icons
            preview:
              text:
                - key: name
              image:
                - template: src/icons/{id}.svg
        style.iconBackground:
          # Hidden rather than removed: the key stays in the value so an item
          # still matches this structure, and the component no longer reads it.
          # A card has two looks, not four, and that is the switch below.
          hidden: true
          type: switch
        style.panelColor:
          type: select
          label: Panel colour
          comment: The panel's own colour, separate from the card's rule.
          hidden: "!style.iconPanel"
          options:
            values:
              - id: harbour
                name: Harbour
              - id: pacific
                name: Pacific
              - id: golden
                name: Golden
              - id: moss
                name: Moss
              - id: sunset
                name: Sunset
              - id: blush
                name: Blush
              - id: black
                name: Near-black
        style.panelImage:
          type: image
          label: Panel mark
          comment: >-
            A mark drawn on the panel where a tool has one of its own. It is
            masked, so the file's own colour does not matter. Empty falls back
            to the icon.
          hidden: "!style.iconPanel"
        style.panelImageColor:
          type: text
          label: Panel mark colour
          comment: A palette or semantic colour name the mark is masked to.
          hidden: "!style.panelImage"
        style.iconPanel:
          type: switch
          label: Mark on a panel
          comment: >-
            Draws the mark large on a scratched panel across the card's top,
            in the card's accent colour, instead of beside the title.
        style.iconSolid:
          type: switch
          hidden: "!iconName"
          comment: >-
            Draw the icon on a filled disc rather than as a coloured glyph on
            its own. The glyph is knocked out in whatever reads on the colour.
        style.accentColor:
          type: select
          comment: The card's colour, drawn on its rule and on its icon.
          options:
            values:
              - id: none
                name: None
                swatch: check_box_outline_blank
              - id: pacific
                name: Pacific
                swatch: square
                color: "#034AD8"
              - id: moss
                name: Moss
                swatch: square
                color: "#687E00"
              - id: golden
                name: Golden
                swatch: square
                color: "#FFAA00"
              - id: peachy
                name: Peachy
                swatch: square
                color: "#F39B7B"
              - id: sunset
                name: Sunset
                swatch: square
                color: "#D85A2C"
              - id: harbour
                name: Harbour
                swatch: square
                color: "#A6C1FA"
            picker_view: card
            preview:
              icon:
                - key: swatch
              icon_color:
                - key: color
              text:
                - key: name
        style.divider:
          type: switch
          comment: A hairline between the card's head and its line.
        style.alignmentHorizontal:
          type: select
          comment: Which way the card sets its copy.
          options:
            values:
              - id: start
                name: Start
              - id: center
                name: Center
