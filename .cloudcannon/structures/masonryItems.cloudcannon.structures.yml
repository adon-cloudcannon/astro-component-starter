# masonryItems, lifted out of masonry.cloudcannon.structure-value.yml.
#
# Must live here. `_structures_from_glob` in cloudcannon.config.yml only picks
# up this folder, so a `_structures` block written inside a component's
# structure-value file reaches nothing: the array that referenced it resolved
# to `values: []`, no item matched a structure, and every field in the item
# fell back to CloudCannon guessing a type from its key. That is why a card's
# Title Size drew a text box and its Icon Color a hex picker.
masonryItems:
  values:
    - label: Masonry Item
      value:
        contentSections: []
      preview:
        icon: view_quilt
        text: Masonry Item
        subtext:
          - template: Contains {contentSections|array_length} content {"block"|pluralize=contentSections}
          - Add one or more content blocks to the masonry item
      _inputs:
        contentSections:
          type: array
          comment: Content sections to render within this masonry item.
          options:
            structures: _structures.masonryItemSections
