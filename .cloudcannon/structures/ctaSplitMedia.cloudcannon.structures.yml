# What can fill the other half of a generic CTA split: a picture, or a video.
#
# The built things — the reveal, the camera, the terminal, the chat — are not
# here. They each need the band shaped around them, which is what CTA Showcase
# is for.
ctaSplitMedia:
  id_key: _component
  style: modal
  values_from_glob:
    - /src/components/building-blocks/core-elements/image/image.cloudcannon.structure-value.yml
    - /src/components/building-blocks/core-elements/video/video.cloudcannon.structure-value.yml
