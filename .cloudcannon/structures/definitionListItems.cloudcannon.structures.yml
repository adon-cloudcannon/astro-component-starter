# definitionListItems, lifted out of definition-list.cloudcannon.structure-value.yml.
#
# Must live here. `_structures_from_glob` in cloudcannon.config.yml only picks
# up this folder, so a `_structures` block written inside a component's
# structure-value file reaches nothing: the array that referenced it resolved
# to `values: []`, no item matched a structure, and every field in the item
# fell back to CloudCannon guessing a type from its key. That is why a card's
# Title Size drew a text box and its Icon Color a hex picker.
definitionListItems:
  values:
    - label: Definition List Item
      value:
        title: My definition title
        text: My definition content
      preview:
        icon: list
        text:
          - key: title
          - Definition List Item
        subtext:
          - key: text
      _inputs:
        title:
          type: text
          comment: A bolded title for the list item.
        text:
          type: markdown
          comment: The text content of the list item.
          options:
            blockquote: false
            bold: true
            format: null
            italic: true
            link: true
            strike: false
            subscript: true
            superscript: true
            underline: false
