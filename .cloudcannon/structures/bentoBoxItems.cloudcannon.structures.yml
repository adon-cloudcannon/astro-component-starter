# bentoBoxItems, lifted out of bento-box.cloudcannon.structure-value.yml.
#
# Must live here. `_structures_from_glob` in cloudcannon.config.yml only picks
# up this folder, so a `_structures` block written inside a component's
# structure-value file reaches nothing: the array that referenced it resolved
# to `values: []`, no item matched a structure, and every field in the item
# fell back to CloudCannon guessing a type from its key. That is why a card's
# Title Size drew a text box and its Icon Color a hex picker.
bentoBoxItems:
  values:
    - label: Bento Box Item
      value:
        colSpan: "1"
        rowSpan: "1"
        contentSections: []
      preview:
        icon: dashboard_customize
        text: Bento Box Item
        subtext:
          - template: >-
              {colSpan}x{rowSpan} — Contains {contentSections|array_length} content
              {"block"|pluralize=contentSections}
          - Add content blocks to this bento item
      _inputs:
        colSpan:
          comment: Number of columns this item spans.
          type: select
          options:
            values:
              - id: "1"
                name: 1 Column
              - id: "2"
                name: 2 Columns
              - id: "3"
                name: 3 Columns
              - id: "4"
                name: 4 Columns
        rowSpan:
          comment: Number of rows this item spans.
          type: select
          options:
            values:
              - id: "1"
                name: 1 Row
              - id: "2"
                name: 2 Rows
              - id: "3"
                name: 3 Rows
              - id: "4"
                name: 4 Rows
        contentSections:
          type: array
          comment: Content sections to render within this bento box item.
          options:
            structures: _structures.bentoBoxSections
