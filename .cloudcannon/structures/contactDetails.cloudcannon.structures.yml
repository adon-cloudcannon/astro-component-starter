# contactDetails, lifted out of contact-split.cloudcannon.structure-value.yml.
#
# Must live here. `_structures_from_glob` in cloudcannon.config.yml only picks
# up this folder, so a `_structures` block written inside a component's
# structure-value file reaches nothing: the array that referenced it resolved
# to `values: []`, no item matched a structure, and every field in the item
# fell back to CloudCannon guessing a type from its key. That is why a card's
# Title Size drew a text box and its Icon Color a hex picker.
contactDetails:
  values:
    - label: Detail
      icon: contact_mail
      value:
        icon: map-pin
        label: Label
        value: The detail itself
        url: ""
      preview:
        text:
          - key: label
          - Detail
        subtext:
          - key: value
        image:
          - template: src/icons/{icon}.svg
      _inputs:
        icon:
          type: select
          comment: Small icon beside the detail. Sourced from [Lucide](https://lucide.dev/icons/).
          options:
            values: data.icons
            preview:
              text:
                - key: name
              image:
                - template: src/icons/{id}.svg
        label:
          type: text
          comment: What this detail is (Address, Phone, …). Read by screen readers, not shown.
        value:
          type: text
          comment: The detail itself, as shown.
        url:
          type: text
          comment: Optional link — use tel:… for phone numbers and mailto:… for email addresses.
