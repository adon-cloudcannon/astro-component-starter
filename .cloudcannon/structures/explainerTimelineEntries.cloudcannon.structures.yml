# explainerTimelineEntries, lifted out of timeline-section.cloudcannon.structure-value.yml.
#
# Must live here. `_structures_from_glob` in cloudcannon.config.yml only picks
# up this folder, so a `_structures` block written inside a component's
# structure-value file reaches nothing: the array that referenced it resolved
# to `values: []`, no item matched a structure, and every field in the item
# fell back to CloudCannon guessing a type from its key. That is why a card's
# Title Size drew a text box and its Icon Color a hex picker.
explainerTimelineEntries:
  values:
    - label: Entry
      icon: timeline
      value:
        year: ""
        date: "2024"
        title: Entry title
        body: ""
        iconName: ""
        accentColor: ""
      preview:
        text:
          - key: title
          - Entry
        subtext:
          - key: date
      _inputs:
        year:
          type: text
          comment: Optional. Set the same year on consecutive entries to group them (month goes in Date).
        date:
          type: text
          comment: >-
            The date shown beside the rail — a year (`2019`), a quarter (`Q3 2026`), or a month
            when Year is set.
        title:
          type: text
          comment: What happened.
        body:
          type: textarea
          comment: Optional supporting copy. Title-only entries are valid.
        accentColor:
          type: select
          label: Marker color
          comment: Fills the marker in Split and Rail layouts. Leave blank for the section's own color.
          options:
            values:
              - id: ""
                name: Default
                swatch: check_box_outline_blank
              - id: moss
                name: Moss
                swatch: square
                color: "#687E00"
              - id: pacific
                name: Pacific
                swatch: square
                color: "#034AD8"
              - id: sunset
                name: Sunset
                swatch: square
                color: "#D85A2C"
              - id: golden
                name: Golden
                swatch: square
                color: "#FFAA00"
              - id: peachy
                name: Peachy
                swatch: square
                color: "#F39B7B"
              - id: harbour
                name: Harbour
                swatch: square
                color: "#A6C1FA"
            picker_view: card
            preview:
              icon:
                - key: swatch
              icon_color:
                - key: color
              text:
                - key: name
        iconName:
          type: select
          label: Marker icon
          comment: Optional icon shown in Split and Rail layouts. Leave blank for a dot.
          options:
            values: data.icons
            preview:
              text:
                - key: name
              image:
                - template: src/icons/{id}.svg
