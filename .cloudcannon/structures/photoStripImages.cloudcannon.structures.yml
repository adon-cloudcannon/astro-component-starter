# A photograph in a photo strip.
#
# Here rather than inside the component's structure-value file: a `_structures`
# block there reaches only the component it sits in.
photoStripImages:
  values:
    - label: Photo
      icon: photo_camera
      value:
        _component: page-sections/proof/photo-strip/photo-strip-image
        source: ""
        alt: ""
        backgroundColor: none
        scratched: true
      preview:
        text:
          - key: alt
          - Photo
        image:
          - key: source
      _inputs:
        backgroundColor:
          type: text
          label: Plate colour
          comment: >-
            A coloured plate behind the cut-out, by palette name. "none"
            leaves the picture on its own.
        scratched:
          type: switch
          label: Scratched
          comment: Scratches through the plate, so the page shows through it.
